<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pişti | Protokol</title>
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Ana sitedeki (protokol.sbs) omu-protokol Firebase projesiyle aynı config -- bkz. pisti-oyun.js. -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<link rel="stylesheet" href="./css/main-v4-Cp8P4lJI.css">
<style>
  html, body { background: #0f0b15 !important; min-height: 100%; }
  body { overflow-x: hidden; }
  .sidebar, .topbar, .footer, .page-header { display: none !important; }
  .main { min-height: 100dvh !important; margin-inline-start: 0 !important; padding-top: 0 !important; }
  .main .page-wrapper { width: 100%; max-width: none; padding: 12px 16px 16px; }
  .pisti-masa-viewport { flex: 1 1 auto; align-items: center; }
  .pisti-masa { min-height: min(760px, calc(100dvh - 36px)); }

  /* Pişti kartları: üst üste gelen görseller komşu kartın tıklamasını çalmasın. */
  .pisti-el-kart-btn {
    width: 56px;
    margin-left: -28px;
    touch-action: none;
  }
  .pisti-el-kart-btn .pisti-kart {
    width: 96px;
    margin-left: -20px;
    pointer-events: none;
  }
  .pisti-el-kart-btn.pisti-el-kart-suruklenen,
  .pisti-el-kart-btn.pisti-el-kart-suruklenen:hover {
    transform: translateX(calc(var(--pisti-x) + var(--pisti-drag-x, 0px)))
      translateY(calc(var(--pisti-y) + var(--pisti-drag-y, 0px)))
      rotate(var(--pisti-rot));
    transition: none;
    cursor: grabbing;
    z-index: 999 !important;
  }
  .pisti-elim:has(.pisti-el-kart-suruklenen) .pisti-el-kart-btn:not(.pisti-el-kart-suruklenen),
  .pisti-elim:has(.pisti-el-kart-btn:hover) .pisti-el-kart-btn:not(:hover) {
    pointer-events: none;
  }
  .pisti-el-kart-btn:not(:disabled):hover,
  .pisti-el-kart-btn:not(:disabled):focus-visible {
    transform: translateX(calc(var(--pisti-x) + var(--pisti-drag-x, 0px)))
      translateY(-54px) rotate(calc(var(--pisti-rot) * .3)) scale(1.06);
    z-index: 999 !important;
    outline: none;
  }
  .pisti-kart-ucusu {
    position: fixed;
    z-index: 9999;
    pointer-events: none;
    will-change: transform, opacity;
    transition: transform .32s cubic-bezier(.22, .61, .36, 1), opacity .32s ease-in;
  }
  .pisti-koltuk-topladigi {
    position: relative;
    display: inline-flex;
    align-items: center;
    min-height: 22px;
    padding-inline: 17px;
  }
  .pisti-koltuk-topladigi::before,
  .pisti-koltuk-topladigi::after {
    content: '';
    position: absolute;
    width: 14px;
    aspect-ratio: 5 / 7;
    border: 1px solid rgba(255, 255, 255, .55);
    border-radius: 2px;
    background: #7b2632 url('/assets/blackjack/deste-arkalari/deste-arkasi-01.png') center / cover;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .35);
  }
  .pisti-koltuk-topladigi::before { left: 0; transform: rotate(-9deg); }
  .pisti-koltuk-topladigi::after { right: 0; transform: rotate(9deg); }
  @media (max-width: 720px) {
    .pisti-el-kart-btn { width: 58px; margin-left: -29px; }
  }
</style>
</head>
<body data-page="games">

<main class="main">
<div class="page-wrapper">

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle">Oyunlar</div>
        <h1 class="page-title">Pişti</h1>
      </div>
    </div>
  </div>

  <div class="pisti-islem-durumu">
    <span data-pisti-durum role="status" aria-live="polite"></span>
    <button type="button" class="btn btn-primary" data-pisti-baslat hidden>Oyunu başlat</button>
    <button type="button" class="btn btn-outline" data-pisti-yeniden-dene hidden>Tekrar dene</button>
    <button type="button" class="btn btn-outline" data-pisti-kalk-durum hidden>Kalk</button>
    <button type="button" class="btn btn-outline" data-pisti-teklif-bitir hidden>Oyunu bitir</button>
  </div>
  <div class="pisti-teklif-paneli" data-pisti-teklif-paneli hidden></div>

  <div class="pisti-skor-tablosu" data-pisti-skor-tablosu></div>

  <div class="pisti-masa-viewport">
    <div class="pisti-masa" data-pisti-root>
      <div class="pisti-koltuklar" data-pisti-koltuklar></div>
      <div class="pisti-masa-kartlari-alani">
        <div class="pisti-masa-kartlari" data-pisti-masa-kartlari></div>
      </div>
      <div class="pisti-elim" data-pisti-elim></div>
      <div class="pisti-el-bitti-paneli" data-pisti-el-bitti-paneli hidden></div>
      <div class="pisti-oyun-bitti-paneli" data-pisti-oyun-bitti-paneli hidden></div>
    </div>
  </div>

  <p class="hint" data-pisti-oturmadim hidden style="text-align:center;">Oynamak için boş bir koltuğa (+) tıklayın.</p>
  <div style="text-align:center;">
    <span aria-live="polite" data-pisti-sira-bildirimi></span>
    <strong data-pisti-sayac></strong>
  </div>

</div>
</main>

<script type="module" src="./js/oyun-pisti-pnMqftMH.js"></script>
<script type="module" src="./js/pisti-card-interaction.js"></script>

</body>
</html>
