        var theme = 'dark'
        try {
          var stored = localStorage.getItem('protokol-theme')
          if (stored === 'light' || stored === 'dark') theme = stored
        } catch (e) {}
        document.documentElement.classList.toggle('dark', theme === 'dark')
        document.documentElement.dataset.theme = theme
      })()
