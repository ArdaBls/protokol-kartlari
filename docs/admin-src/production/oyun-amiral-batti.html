<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Amiral Battı | Protokol</title>
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Ana sitedeki (protokol.sbs) omu-protokol Firebase projesiyle aynı config -- bkz. amiral-batti.js. -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="games" data-breadcrumb="Anasayfa|index.html > Oyunlar|oyunlar.html > Amiral Battı">

<main class="main">
<div class="page-wrapper">

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle">Oyunlar</div>
        <h1 class="page-title">Amiral Battı</h1>
      </div>
    </div>
  </div>

  <!-- Oyun yokken (?oyun= parametresi yok): yeni oyun başlat + oyunlarım listesi + liderlik tablosu. -->
  <div data-ab-lobby>
    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">Yeni oyun</div>
          <div class="card-subtitle">Bir davet linki oluşturur, arkadaşınıza gönderirsiniz</div>
        </div>
        <div class="card-options">
          <button type="button" class="btn btn-primary" data-ab-new-game>+ Yeni Oyun</button>
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="card-header">
        <div>
          <div class="card-title">Oyunlarım</div>
          <div class="card-subtitle" data-ab-my-games-count>Yükleniyor…</div>
        </div>
      </div>
      <div class="card-body" data-ab-my-games style="padding:0"></div>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="card-header">
        <div>
          <div class="card-title">Liderlik Tablosu</div>
          <div class="card-subtitle">En çok galibiyet</div>
        </div>
      </div>
      <div class="card-body" data-ab-leaderboard style="padding:0"></div>
    </div>
  </div>

  <!-- Oyun ekranı (?oyun=<id> varken) -- JS ile doldurulur. -->
  <div data-ab-game-view hidden></div>

</div>
</main>

<!-- Rakip seçme modalı -- staffProfiles'tan (editör de okuyabiliyor) arama. -->
<div class="ab-invite-modal" data-ab-invite-modal hidden>
  <div class="ab-invite-modal-inner">
    <div class="ab-invite-modal-header">
      <span>Rakip seç</span>
      <button type="button" class="modal-close" data-ab-invite-close aria-label="Kapat">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 5l10 10M15 5L5 15"/></svg>
      </button>
    </div>
    <input type="text" class="form-control" data-ab-invite-search placeholder="İsim ara…">
    <div class="ab-invite-list" data-ab-invite-list></div>
  </div>
</div>

<script type="module">
import('/src/v4/amiral-batti.js').then((m) => m.initAmiralBatti());
</script>

</body>
</html>
