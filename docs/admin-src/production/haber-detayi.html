<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Haber detayı | Protokol</title>
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<!-- Kullanıcı isteği: CKEditor yerine TinyMCE (editör deneyimi daha iyi bulundu).
     jsDelivr üzerinden açık kaynak (GPL) TinyMCE dağıtımı -- Tiny Cloud API anahtarı
     GEREKMİYOR, "bu alan adı kayıtlı değil" uyarı çubuğu göstermez. -->
<script src="https://cdn.jsdelivr.net/npm/tinymce@7/tinymce.min.js"></script>
<!-- DOMPurify: haberMetni TinyMCE'nin ürettiği HTML olduğu için escape EDİLEMEZ (biçimlendirme
     kaybolur), ama `etkinlikler` düğümüne herhangi bir editor rolü yazabildiğinden depolanmış
     XSS yüzeyi var. Ham HTML basılan her yerde sanitize etmek için TinyMCE ile aynı desende
     (jsDelivr, sürüm sabitlenmiş major) yüklenir. -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="project-detail" data-breadcrumb="Anasayfa|index.html > Tüm haberler|tum-haberler.html > Haber detayı">

<main class="main">
<div class="page-wrapper">

  <div id="detail-root">
    <div class="page-header"><div class="page-header-row"><div><h1 class="page-title">Yükleniyor…</h1></div></div></div>
  </div>

</div>
</main>

<script type="module">
// Fakülte/birim listesi + basın görevlisi picker'ı takvimdeki (calendar.js) etkinlik
// düzenleme formuyla AYNI paylaşılan modülden gelir (bkz. roster.js) -- iki yer birbirinden
// bağımsız kopya listeler tutmasın diye (kullanıcı isteği: eşzamanlı olmalı her yerle).
import { facultyOptionsHtml, loadPressOfficerPool, renderPersonRolesPickerHtml } from '/src/v4/roster.js';

const firebaseConfig = {
  apiKey: 'AIzaSyDOfhq3aYW6sg2_zj0sFsRzXeGziGtLxCk',
  authDomain: 'omu-protokol.firebaseapp.com',
  databaseURL: 'https://omu-protokol-default-rtdb.europe-west1.firebasedatabase.app',
  projectId: 'omu-protokol'
};
if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
const database = firebase.database();

const DURUM_LABEL = { planlandi: 'Planlandı', yaziliyor: 'Haber yazılıyor', incelemede: 'İncelemede', tamamlandi: 'Tamamlandı', iptal: 'İptal' };
const DURUM_CLS   = { yaziliyor: 'status-yellow', incelemede: 'status-blue', tamamlandi: 'status-green', iptal: 'status-red' };
const LEGACY_DURUM = { cekildi: 'planlandi', haber: 'yaziliyor', yayinlandi: 'tamamlandi' };
const normalizeDurum = (d) => { const k = d || 'planlandi'; return LEGACY_DURUM[k] || k; };

const root = document.getElementById('detail-root');
const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const parseNameList = (s) => String(s || '').split(',').map((x) => x.trim()).filter(Boolean);

// escapeHtml `javascript:` şemasını ENGELLEMEZ: escape edilmiş bir "javascript:alert(1)"
// href olarak hâlâ çalışır ve `arsiv` alanına bunu yazan bir editör, sayfayı açan kişinin
// oturumunda kod çalıştırabilir. Bu yüzden href'e basmadan önce şema beyaz listeden geçer
// (calendar.js'teki safeLinkUrl ile birebir aynı mantık -- iki yerde aynı davranış olsun diye).
function safeLinkUrl(u) { const s = String(u === undefined || u === null ? '' : u).trim(); return /^https?:\/\//i.test(s) ? s : ''; }

// haberMetni TinyMCE HTML'i olduğu için escape edilemez; sanitize edilir. DOMPurify CDN'den
// gelmemiş olabilir (ağ hatası/engelleme) -- bu durumda sessizce ham HTML basmak yerine
// GÜVENLİ tarafa düşüp escape ediyoruz: biçimlendirme kaybolur ama XSS yüzeyi açılmaz.
const sanitizeHtml = (h) => (window.DOMPurify ? window.DOMPurify.sanitize(String(h == null ? '' : h)) : escapeHtml(h == null ? '' : h));

function fmtTarih(key) {
  if (!key) return '';
  const [y, m, d] = key.split('-');
  return d && m && y ? `${d}.${m}.${y}` : key;
}

// calendar.js'teki parseKey ile birebir aynı doğrulama: takvim `eventList()` içinde
// `if (!e.tarih) continue;` dediği ve tarihleri YYYY-MM-DD anahtarı olarak eşlediği için,
// buradan geçersiz/boş bir tarih yazılırsa etkinlik takvimin HİÇBİR görünümünde çıkmaz
// ("hayalet kayıt"). Yıl/ay/gün geri okunduğunda birebir eşleşmeli -- 2025-02-31 gibi
// takvimsel olarak var olmayan tarihler Date tarafından kaydırıldığı için böyle yakalanır.
function isValidDateKey(s) {
  const a = String(s || '').split('-');
  if (a.length !== 3) { return false; }
  const y = Number(a[0]), m = Number(a[1]), day = Number(a[2]);
  if (!Number.isInteger(y) || !Number.isInteger(m) || !Number.isInteger(day)) { return false; }
  const d = new Date(y, m - 1, day);
  if (isNaN(d.getTime())) { return false; }
  return d.getFullYear() === y && d.getMonth() === m - 1 && d.getDate() === day;
}

// Gelişmiş editör: TinyMCE (kullanıcı isteği -- CKEditor yerine, editör deneyimi
// daha iyi bulundu). #haberEditor bir <textarea> -- TinyMCE onu bulup zengin metin
// editörüne çeviriyor, getContent()/setContent() ile HTML okunup yazılıyor.
// tinymce.init() bir dizi editör örneğiyle çözülen bir promise döner.
async function createHaberEditor(el) {
  const [editor] = await tinymce.init({
    target: el,
    license_key: 'gpl',
    height: 420,
    menubar: false,
    branding: false,
    promotion: false,
    plugins: 'advlist autolink lists link charmap searchreplace visualblocks code fullscreen insertdatetime media table wordcount',
    toolbar: 'undo redo | blocks fontfamily fontsize | bold italic underline strikethrough forecolor backcolor removeformat | ' +
      'alignleft aligncenter alignright alignjustify | bullist numlist outdent indent | ' +
      'link table media charmap | searchreplace code fullscreen',
    content_style: 'body{font-family:Plus Jakarta Sans,sans-serif;font-size:14px}'
  });
  return editor;
}

function setMessage(title, body) {
  root.innerHTML = `
    <div class="page-header"><div class="page-header-row"><div>
      <div class="page-pretitle">Haberler</div>
      <h1 class="page-title">${escapeHtml(title)}</h1>
    </div></div></div>
    <div class="card"><div class="card-body" style="color:var(--text-muted)">${escapeHtml(body)}</div></div>
  `;
}

let canWrite = false;
let editorInstance = null;

function render(id, e) {
  // render() birden fazla kez çalışabiliyor (ör. sayfa açıkken oturum durumu değişince
  // onAuthStateChanged -> loadEvent() -> render()). Aşağıdaki root.innerHTML ataması eski
  // #haberEditor'ü DOM'dan söküyor ama TinyMCE örneği bellekte kalıyor; aynı id'ye ikinci
  // init kopuk (detached) bir örnek bırakıp getContent()'i yanlış editörden okutabiliyor.
  // Bu yüzden DOM'u ezmeden ÖNCE varsa mevcut örneği kaldırıyoruz. TinyMCE CDN'den
  // yüklenemediyse window.tinymce tanımsız olabilir -- savunmacı davranıyoruz.
  if (window.tinymce) { try { window.tinymce.remove('#haberEditor'); } catch (err) { console.error('TinyMCE temizlenemedi:', err); } }
  editorInstance = null;

  const durum = normalizeDurum(e.durum);
  const yazanlar = parseNameList(e.haberYazanlari);
  const gorevliler = parseNameList(e.gorevli);
  // Şeması güvenli olmayan (http/https dışı) bir arşiv bağlantısı hiç render edilmez --
  // "tıklanabilir ama zararsız" bir buton bırakmak yerine butonu tamamen gizliyoruz ki
  // kullanıcı bozuk/kötü niyetli bir bağlantıyı meşru sanıp tıklamasın.
  const arsivUrl = safeLinkUrl(e.arsiv);
  document.title = (e.ad || 'Haber detayı') + ' | Protokol';

  root.innerHTML = `
    <div class="page-header">
      <div class="page-header-row">
        <div>
          <div class="page-pretitle">Haberler · ${escapeHtml(fmtTarih(e.tarih))}</div>
          <h1 class="page-title">${escapeHtml(e.ad || '(adsız)')}</h1>
        </div>
        <div class="page-actions">
          <span class="status ${DURUM_CLS[durum] || ''}" style="font-size:12.5px">${DURUM_LABEL[durum] || durum}</span>
          ${arsivUrl ? `<a class="btn btn-outline" href="${escapeHtml(arsivUrl)}" target="_blank" rel="noopener">Arşiv bağlantısı</a>` : ''}
        </div>
      </div>
    </div>

    <div class="row col-8-4">
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="card">
          <div class="card-header">
            <div class="card-title">Haber metni</div>
            ${canWrite ? `<div style="display:flex;align-items:center;gap:10px">
              <span id="haberSaveErr" role="alert" style="display:none;font-size:12.5px;color:var(--danger,#e5484d)"></span>
              <button type="button" class="btn btn-primary" id="haberSaveBtn" style="display:none">Kaydet</button>
            </div>` : ''}
          </div>
          <div class="card-body">
            ${canWrite
              ? `<textarea id="haberEditor">${escapeHtml(e.haberMetni || '')}</textarea>`
              : `<div style="font-size:13px;color:var(--text-secondary);line-height:1.7">${e.haberMetni ? sanitizeHtml(e.haberMetni) : '<span style="color:var(--text-muted)">Bu etkinlik için henüz haber metni girilmemiş.</span>'}</div>`}
          </div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="card">
          <div class="card-header"><div class="card-title">Etkinlik bilgileri</div></div>
          <div class="card-body" style="display:flex;flex-direction:column;gap:10px">
            ${canWrite ? `
              <div class="field"><label for="ed-tarih">Tarih</label><input type="date" id="ed-tarih" class="form-control" value="${escapeHtml(e.tarih || '')}"></div>
              <div class="field"><label for="ed-yer">Yer / Mekân</label><input type="text" id="ed-yer" class="form-control" value="${escapeHtml(e.yer || '')}"></div>
              <div class="field"><label for="ed-birim">Düzenleyen Birim</label><select id="ed-birim" class="form-control"><option value="">—</option>${facultyOptionsHtml(e.birim || '')}</select></div>
              <div class="field"><label for="ed-planlayan">Planlayan / Sorumlu</label><input type="text" id="ed-planlayan" class="form-control" value="${escapeHtml(e.planlayan || '')}"></div>
            ` : `
              <div style="font-size:13px;color:var(--text-secondary);line-height:2">
                <div><span style="color:var(--text-muted)">Tarih</span> · <strong style="color:var(--text)">${escapeHtml(fmtTarih(e.tarih))}</strong></div>
                ${e.yer ? `<div><span style="color:var(--text-muted)">Yer</span> · ${escapeHtml(e.yer)}</div>` : ''}
                ${e.birim ? `<div><span style="color:var(--text-muted)">Düzenleyen birim</span> · ${escapeHtml(e.birim)}</div>` : ''}
                ${e.planlayan ? `<div><span style="color:var(--text-muted)">Planlayan</span> · ${escapeHtml(e.planlayan)}</div>` : ''}
              </div>
            `}
          </div>
        </div>

        <div class="card">
          <div class="card-header"><div class="card-title">Basın görevlisi / Haberi yazan(lar)</div></div>
          <div class="card-body">
            ${canWrite
              ? `<input type="text" class="cal-ev-att-search" id="ed-personSearch" placeholder="İsim ara…"><div class="cal-ev-att-box cal-ev-role-box" id="ed-personBox"></div>`
              : `
                <div style="font-size:13px;color:var(--text-secondary);line-height:1.7">
                  <div style="margin-bottom:8px"><span style="color:var(--text-muted)">Basın görevlisi</span><br>${gorevliler.length ? gorevliler.map((n) => escapeHtml(n)).join('<br>') : '<span style="color:var(--text-muted)">Atanmamış.</span>'}</div>
                  <div><span style="color:var(--text-muted)">Haberi yazan(lar)</span><br>${yazanlar.length ? yazanlar.map((n) => escapeHtml(n)).join('<br>') : '<span style="color:var(--text-muted)">Henüz işlenmemiş.</span>'}</div>
                </div>
              `}
          </div>
        </div>
      </div>
    </div>
  `;

  if (canWrite) {
    const saveBtn = document.getElementById('haberSaveBtn');
    const fieldIds = ['ed-tarih', 'ed-yer', 'ed-birim', 'ed-planlayan'];
    const fieldEls = fieldIds.map((fid) => document.getElementById(fid));

    // Basın görevlisi / haberi yazan(lar) artık serbest metin DEĞİL, takvimdeki (calendar.js)
    // düzenleme modalıyla AYNI kişi/rol picker'ı (bkz. roster.js) -- calPressStaff/calNewsWriters
    // bu modalın yerel state'i, checkbox değişiklikleri buraya yazılır.
    let pressOfficerPool = [];
    const calPressStaff = parseNameList(e.gorevli);
    const calNewsWriters = parseNameList(e.haberYazanlari);
    const personBox = document.getElementById('ed-personBox');
    const personSearch = document.getElementById('ed-personSearch');
    const renderPersonBox = () => {
      if (!personBox) { return; }
      personBox.innerHTML = renderPersonRolesPickerHtml(pressOfficerPool, personSearch ? personSearch.value : '', calPressStaff, calNewsWriters);
    };
    renderPersonBox();
    loadPressOfficerPool(database).then((pool) => { pressOfficerPool = pool; renderPersonBox(); });
    personSearch?.addEventListener('input', renderPersonBox);
    personBox?.addEventListener('change', (ev) => {
      const t = ev.target;
      const name = t.dataset.name || '';
      if (!name) { return; }
      const list = t.classList.contains('cal-ev-role-basin') ? calPressStaff : t.classList.contains('cal-ev-role-haber') ? calNewsWriters : null;
      if (!list) { return; }
      if (t.checked) { if (list.indexOf(name) === -1) { list.push(name); } }
      else { const idx = list.indexOf(name); if (idx !== -1) { list.splice(idx, 1); } }
      updateSaveVisibility();
    });

    const saveErr = document.getElementById('haberSaveErr');
    // Sayfada showToast yok; hata mesajı Kaydet butonunun yanında satır içi gösteriliyor
    // (alert() kaydetme akışını kesip odak kaybettiriyor, kullanıcı hatalı alana dönemiyor).
    const showSaveError = (msg) => {
      if (saveErr) { saveErr.textContent = msg; saveErr.style.display = ''; }
      else { alert(msg); }
    };
    const clearSaveError = () => { if (saveErr) { saveErr.textContent = ''; saveErr.style.display = 'none'; } };

    const sortedJoin = (list) => list.slice().sort((a, b) => a.localeCompare(b, 'tr')).join(', ');
    let updateSaveVisibility = () => {};

    createHaberEditor(document.getElementById('haberEditor')).then((editor) => {
      editorInstance = editor;
      const originalHtml = editor.getContent();
      const original = { haberMetni: originalHtml, gorevli: sortedJoin(calPressStaff), haberYazanlari: sortedJoin(calNewsWriters) };
      fieldIds.forEach((fid, i) => { original[fid] = fieldEls[i].value; });

      updateSaveVisibility = () => {
        const changed = editor.getContent() !== original.haberMetni ||
          fieldIds.some((fid, i) => fieldEls[i].value !== original[fid]) ||
          sortedJoin(calPressStaff) !== original.gorevli ||
          sortedJoin(calNewsWriters) !== original.haberYazanlari;
        saveBtn.style.display = changed ? '' : 'none';
      };
      editor.on('input change undo redo keyup', updateSaveVisibility);
      fieldEls.forEach((el) => el.addEventListener('input', updateSaveVisibility));

      saveBtn.addEventListener('click', () => {
        clearSaveError();
        // Tarih YAZMADAN ÖNCE doğrulanır: kaydın tarihi zaten yoksa ve kullanıcı da
        // girmezse eskiden tarih:'' yazılıyordu ve etkinlik takvimden tamamen kayboluyordu.
        // Boş/geçersiz tarihle kaydetmektense hiç kaydetmemek daha az zarar verir.
        const tarih = fieldEls[0].value || e.tarih || '';
        if (!isValidDateKey(tarih)) {
          showSaveError('Geçerli bir tarih girin (gg.aa.yyyy). Tarihsiz kayıt takvimde görünmez.');
          fieldEls[0].focus();
          saveBtn.disabled = false; saveBtn.textContent = 'Kaydet';
          return;
        }
        saveBtn.disabled = true; saveBtn.textContent = 'Kaydediliyor…';
        const patch = {
          haberMetni: editor.getContent(),
          tarih,
          yer: fieldEls[1].value.trim(),
          birim: fieldEls[2].value,
          planlayan: fieldEls[3].value.trim(),
          haberYazanlari: sortedJoin(calNewsWriters),
          gorevli: sortedJoin(calPressStaff),
          // Aynı alanın iki farklı saat kaynağıyla yazılması (istemci saati vs. sunucu saati)
          // saati bozuk bir istemcide sıralamayı bozar; projedeki diğer tüm yazmalar
          // (calendar.js persistEvent, app.js) sunucu damgası kullanıyor.
          guncellemeTs: firebase.database.ServerValue.TIMESTAMP
        };
        database.ref('etkinlikler/' + id).update(patch).then(() => {
          // Log şeması ana siteyle (app.js persistEvent) ve bildirimler.html'in okuduğu
          // alanlarla BİREBİR aynı olmalı: bildirimler.html tarihi `timestamp`'ten okuyup
          // ona göre sıralıyor -- `ts` yazılırsa kayıt 01.01.1970 görünüp listenin dibine düşer.
          database.ref('logs/etkinlik').push({
            by: currentUserName || currentUserEmail, email: currentUserEmail,
            action: (e.ad || '(adsız)') + ' etkinliğinin haber detayı güncellendi',
            target: e.ad || '',
            timestamp: firebase.database.ServerValue.TIMESTAMP
          });
          // patch.guncellemeTs bir sunucu damgası "sentinel"i (gerçek sayı değil); yerel
          // kopyaya taşınırsa sonraki okumalarda sayı sanılıp karışıklık yaratır, bu yüzden
          // yerel nesneye sadece gerçek değerler yazılır.
          Object.assign(e, patch, { guncellemeTs: e.guncellemeTs });
          fieldIds.forEach((fid, i) => { original[fid] = fieldEls[i].value; });
          original.haberMetni = editor.getContent();
          original.gorevli = sortedJoin(calPressStaff);
          original.haberYazanlari = sortedJoin(calNewsWriters);
          saveBtn.textContent = 'Kaydedildi ✓';
          setTimeout(() => { saveBtn.style.display = 'none'; saveBtn.disabled = false; saveBtn.textContent = 'Kaydet'; }, 1400);
        }).catch((err) => {
          console.error('Haber detayı kaydedilemedi:', err);
          saveBtn.disabled = false; saveBtn.textContent = 'Kaydet';
          alert('Kaydedilemedi, tekrar deneyin.');
        });
      });
    }).catch((err) => { console.error('TinyMCE başlatılamadı:', err); });
  }
}

let currentUserName = '';
let currentUserEmail = '';
const id = new URLSearchParams(location.search).get('id');

function loadEvent() {
  if (!id) { setMessage('Haber detayı', 'Bir etkinlik seçilmedi. Tüm haberler sayfasından bir habere tıklayın.'); return; }
  database.ref('etkinlikler/' + id).once('value').then((snap) => {
    const e = snap.val();
    if (!e) { setMessage('Haber bulunamadı', 'Bu etkinlik silinmiş veya artık mevcut değil.'); return; }
    render(id, e);
  }).catch((err) => {
    console.error('Haber yüklenemedi:', err);
    setMessage('Haber detayı', 'Yüklenemedi.');
  });
}

firebase.auth().onAuthStateChanged((user) => {
  if (!user) { canWrite = false; loadEvent(); return; }
  database.ref('users/' + user.uid).once('value').then((snap) => {
    const u = snap.val() || {};
    canWrite = u.role === 'editor' || u.role === 'admin' || u.role === 'owner';
    currentUserName = ((u.firstName || '') + ' ' + (u.lastName || '')).trim() || user.email || '';
    currentUserEmail = user.email || '';
    loadEvent();
  }).catch(() => { canWrite = false; loadEvent(); });
});
</script>

</body>
</html>
