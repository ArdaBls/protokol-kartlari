<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Yapılacaklar Listesi | Protokol</title>
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Ana sitedeki (protokol.sbs) omu-protokol Firebase projesiyle aynı config -- bkz. kanban.js. -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="kanban" data-breadcrumb="Anasayfa|index.html > Yapılacaklar Listesi">

<main class="main">
<div class="page-wrapper kanban-page">

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle">Uygulamalar</div>
        <h1 class="page-title">Haber üretim panosu</h1>
      </div>
      <div class="page-actions">
        <div class="kanban-week-nav">
          <button type="button" class="chart-daynav-btn" data-week-prev aria-label="Önceki hafta">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3L5 8l5 5"/></svg>
          </button>
          <span class="kanban-week-nav-label" data-week-label></span>
          <button type="button" class="chart-daynav-btn" data-week-next aria-label="Sonraki hafta">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3l5 5-5 5"/></svg>
          </button>
          <button type="button" class="btn btn-ghost btn-sm" data-week-today>Bugün</button>
        </div>
        <div class="search-box" style="width:220px">
          <svg class="s-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
          <input type="text" id="kanban-filter" placeholder="Etkinlik ara…" aria-label="Etkinlik ara">
        </div>
      </div>
    </div>
  </div>

  <div id="kanban-board" class="kanban-board"></div>

</div>
</main>

<script type="module">
import('/src/v4/kanban.js').then(({ initKanban }) => { initKanban(); });
</script>

</body>
</html>
