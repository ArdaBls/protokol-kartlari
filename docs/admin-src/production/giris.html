<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Giriş yap | Protokol</title>
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <img class="brand-icon" src="/icon-192.png" alt="">
      <div class="brand-name">Protokol</div>
    </div>

    <div class="auth-title">Tekrar hoş geldiniz</div>
    <div class="auth-subtitle">Panonuza devam etmek için giriş yapın.</div>

    <div id="login-error" class="form-hint" style="display:none;color:var(--red);margin-bottom:12px"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="email">E-posta</label>
        <div class="input-group">
          <svg class="input-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M2 5l6 4 6-4"/></svg>
          <input type="email" id="email" class="form-control" placeholder="siz@omu.edu.tr" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Şifre</label>
        <div class="input-group">
          <svg class="input-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5 7V5a3 3 0 016 0v2"/></svg>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>
      </div>

      <!-- "Beni hatırla" kutusu kaldırıldı (kullanıcı isteği: "çalışmıyor zaten").
           Gerçekten de hiçbir yere bağlı değildi: ne id/name'i vardı ne de giriş
           kodunda okunuyordu -- işaretlenmesi ya da kaldırılması hiçbir şeyi
           değiştirmiyordu. Firebase Auth zaten varsayılan olarak "local" kalıcılık
           kullanıyor, yani oturum tarayıcı kapansa da sürüyor; kutunun vaat ettiği
           davranış fiilen HEP açık. Yanıltıcı bir kontrol bırakmamak için silindi. -->
      <div class="auth-actions" style="justify-content:flex-end">
        <a href="sifremi-unuttum.html">Şifremi unuttum</a>
      </div>

      <button type="submit" id="login-submit" class="btn btn-primary" style="width:100%;justify-content:center;height:38px">
        Giriş yap
      </button>
    </form>

    <div class="auth-footer">
      Hesabın yok mu? <a href="kayit-ol.html" id="signup-link">Oluştur</a>
    </div>
  </div>
</div>

<script type="module">
// Görev 4: giris.html gerçek Firebase Auth ile çalışır.
const firebaseConfig = {
  apiKey: 'AIzaSyDOfhq3aYW6sg2_zj0sFsRzXeGziGtLxCk',
  authDomain: 'omu-protokol.firebaseapp.com',
  databaseURL: 'https://omu-protokol-default-rtdb.europe-west1.firebasedatabase.app',
  projectId: 'omu-protokol'
};
if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
const auth = firebase.auth();

// Firebase hata kodlarını genel, kullanıcı-dostu Türkçe metinlere çevir --
// ham Firebase hata metnini kullanıcıya asla gösterme.
const ERROR_MESSAGES = {
  'auth/wrong-password': 'E-posta veya şifre hatalı.',
  'auth/user-not-found': 'E-posta veya şifre hatalı.',
  'auth/invalid-credential': 'E-posta veya şifre hatalı.',
  'auth/invalid-email': 'Geçerli bir e-posta adresi girin.',
  'auth/too-many-requests': 'Çok fazla deneme yapıldı. Lütfen biraz sonra tekrar deneyin.',
  'auth/user-disabled': 'Bu hesap devre dışı bırakılmış.'
};
function messageFor(err) {
  return ERROR_MESSAGES[err && err.code] || 'Giriş yapılamadı. Lütfen tekrar deneyin.';
}

const form = document.getElementById('login-form');
const submitBtn = document.getElementById('login-submit');
const errorEl = document.getElementById('login-error');

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.style.display = '';
}
function hideError() {
  errorEl.style.display = 'none';
}

// Ana site (index.html/takvim.html vb.) artık kendi giriş modalını değil bu sayfayı
// kullanıyor -- "Giriş Yap"a basınca ?returnTo=<geldiği sayfa> ile buraya geliyor,
// başarılı girişten sonra oraya geri dönmesi gerekiyor (admin panelinden girildiyse
// returnTo YOK, varsayılan index.html'e düşer). Açık yönlendirme (open redirect)
// riskine karşı sadece AYNI origin'e dönülür -- dışarıdan gelen bir returnTo
// değeriyle kullanıcı başka bir siteye yönlendirilemez.
function safeReturnTo() {
  const raw = new URLSearchParams(location.search).get('returnTo');
  if (!raw) { return 'index.html'; }
  try {
    const url = new URL(raw, location.origin);
    return url.origin === location.origin ? url.href : 'index.html';
  } catch (_e) { return 'index.html'; }
}
const returnTo = safeReturnTo();
// "Hesabın yok mu?" linkine de returnTo taşınır -- ana siteden geldiyse kayıt
// sonrası da oraya dönebilsin, zincir kayıt sayfasında kopmasın.
const signupLink = document.getElementById('signup-link');
if (signupLink && new URLSearchParams(location.search).get('returnTo')) {
  signupLink.href = 'kayit-ol.html?returnTo=' + encodeURIComponent(returnTo);
}

// Zaten giriş yapılmışsa tekrar formu göstermeden hedefe yönlendir.
auth.onAuthStateChanged((user) => {
  if (user) { window.location.href = returnTo; }
});

form.addEventListener('submit', (e) => {
  e.preventDefault();
  hideError();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  submitBtn.disabled = true;
  const originalLabel = submitBtn.textContent;
  submitBtn.textContent = 'Giriş yapılıyor…';

  auth.signInWithEmailAndPassword(email, password).then(() => {
    window.location.href = returnTo;
  }).catch((err) => {
    console.error('Giriş başarısız:', err);
    showError(messageFor(err));
    submitBtn.disabled = false;
    submitBtn.textContent = originalLabel;
  });
});
</script>

</body>
</html>
