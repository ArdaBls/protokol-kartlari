<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Texas Hold'em | Protokol</title>
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Ana sitedeki omu-protokol Firebase projesiyle aynı config, bkz. holdem-oyun.js. -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="games" data-breadcrumb="Anasayfa|index.html > Oyunlar|oyunlar.html > Texas Hold'em">

<!-- Dikey telefonda masa hiç açılmaz; cihaz yönü tarayıcı tarafından kilitlenemediği için yönlendirme kullanılır. -->
<div class="holdem-rotate-overlay" data-holdem-rotate-overlay role="alert" aria-live="assertive">
  <div class="holdem-rotate-icon" aria-hidden="true">↻</div>
  <strong>Telefonunu yatay çevir</strong>
  <span>Texas Hold'em masasındaki tüm oyuncuları görebilmek için yatay görünüm gerekir.</span>
</div>

<main class="main holdem-main">
<div class="page-wrapper holdem-page-wrapper">

  <div class="page-header holdem-page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle">Oyunlar</div>
        <h1 class="page-title">Texas Hold'em</h1>
      </div>
      <div class="card-options">
        <span class="holdem-bakiye" data-holdem-bakiye>… çip</span>
        <label class="holdem-zorluk-label">Bot zorluğu
          <select data-holdem-bot-zorlugu aria-label="Bot zorluğu">
            <option value="kolay">Kolay</option>
            <option value="normal" selected>Dengeli</option>
            <option value="zor">Zor</option>
          </select>
        </label>
        <button type="button" class="btn btn-outline" data-holdem-masa-ayarlari hidden>Masa ayarları</button>
        <button type="button" class="btn btn-outline holdem-kombinasyon-btn" data-holdem-kombinasyon-ac aria-haspopup="dialog">Kombinasyonlar</button>
      </div>
    </div>
  </div>

  <div class="holdem-islem-durumu" aria-live="polite">
    <span data-holdem-durum></span>
    <button type="button" class="btn btn-outline" data-holdem-yeni-el>Yeni el dağıt</button>
  </div>

  <section class="holdem-masa-viewport" aria-label="Texas Hold'em poker masası">
    <div class="holdem-masa" data-holdem-root>
      <div class="holdem-masa-kece" aria-hidden="true"></div>
      <div class="holdem-kurpiyer" aria-label="Kurpiyer">
        <div class="holdem-kurpiyer-avatar" aria-hidden="true">D</div>
        <strong>Kurpiyer</strong>
        <span>Dağıtıcı</span>
      </div>
      <div class="holdem-pot" data-holdem-pot aria-live="polite"></div>
      <div class="holdem-ortak-kartlar" data-holdem-ortak-kartlar aria-label="Ortak kartlar"></div>
      <div class="holdem-el-bilgisi" data-holdem-el-bilgisi aria-live="polite"></div>
      <div class="holdem-koltuklar" data-holdem-koltuklar aria-label="Oyuncular"></div>
      <div class="holdem-sira-bildirimi" data-holdem-sira-bildirimi aria-live="assertive"></div>

      <div class="holdem-kontrol-alani" data-holdem-kontroller aria-label="Oyun kontrolleri">
        <div class="holdem-artirma-alani" data-holdem-artirma-alani></div>
        <div class="holdem-aksiyonlar" data-holdem-aksiyonlar></div>
      </div>
    </div>
  </section>

</div>
</main>

<dialog class="holdem-kombinasyon-modal" data-holdem-kombinasyon-modal aria-labelledby="holdem-kombinasyon-baslik">
  <div class="holdem-kombinasyon-modal-header">
    <h2 id="holdem-kombinasyon-baslik">Poker kombinasyonları</h2>
    <button type="button" class="btn btn-outline" data-holdem-kombinasyon-kapat aria-label="Kombinasyonları kapat">Kapat</button>
  </div>
  <div class="holdem-kombinasyon-listesi" data-holdem-kombinasyon-listesi></div>
</dialog>

<script type="module">
import('/src/v4/holdem-oyun.js').then((m) => m.initHoldem());
</script>

</body>
</html>
