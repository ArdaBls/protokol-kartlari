<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pişti | Protokol</title>
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Ana sitedeki (protokol.sbs) omu-protokol Firebase projesiyle aynı config -- bkz. pisti-oyun.js. -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="games" data-breadcrumb="Anasayfa|index.html > Oyunlar|oyunlar.html > Pişti">

<main class="main">
<div class="page-wrapper">

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle">Oyunlar</div>
        <h1 class="page-title">Pişti</h1>
      </div>
      <div class="card-options">
        <button type="button" class="btn btn-primary" data-pisti-baslat hidden>Hazırım</button>
      </div>
    </div>
  </div>

  <div data-pisti-dom-ui>
    <div class="pisti-islem-durumu">
      <span data-pisti-durum role="status" aria-live="polite"></span>
      <button type="button" class="btn btn-outline" data-pisti-yeniden-dene hidden>Tekrar dene</button>
      <button type="button" class="btn btn-outline" data-pisti-kalk-durum hidden>Kalk</button>
      <button type="button" class="btn btn-outline" data-pisti-teklif-bitir hidden>Oyunu bitir</button>
    </div>
    <div class="pisti-teklif-paneli" data-pisti-teklif-paneli hidden></div>

    <div class="pisti-skor-tablosu" data-pisti-skor-tablosu></div>

    <div class="pisti-masa-viewport">
      <div class="pisti-masa" data-pisti-root>
        <div class="pisti-koltuklar" data-pisti-koltuklar></div>
        <div class="pisti-masa-kartlari-alani">
          <div class="pisti-masa-kartlari" data-pisti-masa-kartlari></div>
        </div>
        <div class="pisti-elim" data-pisti-elim></div>
        <div class="pisti-el-bitti-paneli" data-pisti-el-bitti-paneli hidden></div>
        <div class="pisti-oyun-bitti-paneli" data-pisti-oyun-bitti-paneli hidden></div>
      </div>
    </div>

    <p class="hint" data-pisti-oturmadim hidden style="text-align:center;">Oynamak için boş bir koltuğa (+) tıklayın.</p>
    <div style="text-align:center;">
      <span aria-live="polite" data-pisti-sira-bildirimi></span>
      <strong data-pisti-sayac></strong>
    </div>
  </div>

  <!-- Godot masası -- SABİT 1600x1100 (motorun kendi çözünürlüğüyle AYNI),
       yalnız dar ekranlarda (mobil) max-width:100% ile küçülüyor. -->
  <div id="pisti-godot-sarici" style="position:relative; width:1600px; height:auto; max-width:100%; aspect-ratio:1600/1100; margin:0 auto; background:#1a2332; border-radius:12px; overflow:hidden; box-sizing:border-box;">
    <canvas id="pisti-godot-canvas" style="width:100%; height:100%; display:block;">
      Tarayıcınız canvas'ı desteklemiyor.
    </canvas>
    <div id="pisti-godot-durum" style="position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); text-align:center; color:#fff; font-family:sans-serif;"></div>
  </div>

</div>
</main>

<script type="module">
import('/src/v4/pisti-oyun.js').then((m) => m.initPisti());
</script>

<script src="/godot/pisti/index.js"></script>
<script>
(function () {
  document.querySelector('[data-pisti-dom-ui]').hidden = true;
  var durumEl = document.getElementById('pisti-godot-durum');
  // NOT: executable'a KLASÖR YOLU dahil -- sayfa /oyun-pisti.html'de ama
  // pck/wasm /godot/pisti/ altında, aksi halde motor bunları sayfayla AYNI
  // dizinde ("/index.pck") arayıp 404 alıyordu.
  // canvasResizePolicy: 1 ("Project") -- canvas HER ZAMAN proje ayarlarındaki
  // 1600x1100'ü kullanır (0=Sabit, 1=Proje, 2=Uyarlanabilir/kutuya göre
  // yeniden boyutlanır -- ikincisi kutunun gerçek boyutuna göre değişip
  // "neden 1600x1100 değil" sorusuna yol açıyordu). CSS zaten kutuyu
  // (max-width:100% + aspect-ratio) dar ekranlarda orantılı küçültüyor.
  var GODOT_CONFIG = { "args": [], "canvasResizePolicy": 1, "executable": "godot/pisti/index", "experimentalVK": false, "fileSizes": { "godot/pisti/index.pck": 394204, "godot/pisti/index.wasm": 39514754 }, "focusCanvas": true, "gdextensionLibs": [] };
  var engine = new Engine(GODOT_CONFIG);
  var eksikler = Engine.getMissingFeatures({ threads: false });
  if (eksikler.length !== 0) {
    durumEl.textContent = 'Tarayıcınız bu oyunu desteklemiyor: ' + eksikler.join(', ');
    return;
  }
  durumEl.textContent = 'Yükleniyor…';
  engine.startGame({
    'canvas': document.getElementById('pisti-godot-canvas'),
    'onProgress': function (guncel, toplam) {
      if (guncel > 0 && toplam > 0) { durumEl.textContent = 'Yükleniyor… ' + Math.round((guncel / toplam) * 100) + '%'; }
    }
  }).then(function () {
    durumEl.remove();
  }, function (hata) {
    console.error('Pişti (Godot) yüklenemedi:', hata);
    durumEl.textContent = 'Oyun yüklenemedi, sayfayı yenileyin.';
  });
}());
</script>

</body>
</html>
