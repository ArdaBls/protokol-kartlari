<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pişti | Protokol</title>
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Ana sitedeki (protokol.sbs) omu-protokol Firebase projesiyle aynı config -- bkz. pisti-oyun.js. -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="games" data-breadcrumb="Anasayfa|index.html > Oyunlar|oyunlar.html > Pişti">

<main class="main">
<div class="page-wrapper">

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle">Oyunlar</div>
        <h1 class="page-title">Pişti</h1>
      </div>
      <div class="card-options">
        <button type="button" class="btn btn-primary" data-pisti-baslat hidden>Oyunu başlat</button>
      </div>
    </div>
  </div>

  <div data-pisti-dom-ui>
    <div class="pisti-islem-durumu">
      <span data-pisti-durum role="status" aria-live="polite"></span>
      <button type="button" class="btn btn-outline" data-pisti-yeniden-dene hidden>Tekrar dene</button>
      <button type="button" class="btn btn-outline" data-pisti-kalk-durum hidden>Kalk</button>
      <button type="button" class="btn btn-outline" data-pisti-teklif-bitir hidden>Oyunu bitir</button>
    </div>
    <div class="pisti-teklif-paneli" data-pisti-teklif-paneli hidden></div>

    <div class="pisti-skor-tablosu" data-pisti-skor-tablosu></div>

    <div class="pisti-masa-viewport">
      <div class="pisti-masa" data-pisti-root>
        <div class="pisti-koltuklar" data-pisti-koltuklar></div>
        <div class="pisti-masa-kartlari-alani">
          <div class="pisti-masa-kartlari" data-pisti-masa-kartlari></div>
        </div>
        <div class="pisti-elim" data-pisti-elim></div>
        <div class="pisti-el-bitti-paneli" data-pisti-el-bitti-paneli hidden></div>
        <div class="pisti-oyun-bitti-paneli" data-pisti-oyun-bitti-paneli hidden></div>
      </div>
    </div>

    <p class="hint" data-pisti-oturmadim hidden style="text-align:center;">Oynamak için boş bir koltuğa (+) tıklayın.</p>
    <div style="text-align:center;">
      <span aria-live="polite" data-pisti-sira-bildirimi></span>
      <strong data-pisti-sayac></strong>
    </div>
  </div>

  <!-- Godot masası -- DENEYSEL, yalnız ?godot=1 ile açılıyor (varsayılan
       ziyaretçiler etkilenmez). Mobilde YATAY moddayken tam ekrana geçer
       (poker sitelerindeki gibi) -- bkz. aşağıdaki <style>. -->
  <style>
    #pisti-godot-sarici { position: relative; width: 1600px; height: auto; max-width: 100%; min-width: 0; aspect-ratio: 1600/1100; margin: 0 auto; background: #1a2332; border-radius: 12px; overflow: hidden; box-sizing: border-box; }
    #pisti-godot-iframe { width: 100%; height: 100%; min-width: 0; border: 0; display: block; }
    @media (max-width: 900px) and (orientation: landscape) {
      #pisti-godot-sarici { position: fixed !important; inset: 0 !important; width: 100vw !important; height: 100vh !important; max-width: none !important; aspect-ratio: unset !important; margin: 0 !important; border-radius: 0 !important; z-index: 9999 !important; }
    }
  </style>
  <div id="pisti-godot-sarici" hidden>
    <iframe id="pisti-godot-iframe" src="/godot/pisti/frame.html" title="Pişti" allow="autoplay"></iframe>
  </div>

</div>
</main>

<script type="module">
import('/src/v4/pisti-oyun.js').then((m) => m.initPisti());
</script>

<script>
(function () {
  if (new URLSearchParams(location.search).get('godot') !== '1') { return; }
  document.querySelector('[data-pisti-dom-ui]').hidden = true;
  document.getElementById('pisti-godot-sarici').hidden = false;
}());
</script>

</body>
</html>
