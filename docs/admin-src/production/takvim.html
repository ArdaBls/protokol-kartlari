<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Takvim | Protokol</title>
<link rel="icon" href="/images/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- Ana sitedeki (protokol.sbs) omu-protokol Firebase projesiyle aynı config -- bkz. calendar.js. -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="calendar" data-breadcrumb="Anasayfa|index.html > Takvim">

<main class="main">
<div class="page-wrapper">

  <div class="card cal-card">
    <div class="calendar-toolbar">
      <div class="nav-btns">
        <button type="button" class="card-opt-btn" id="calPrevBtn" aria-label="Önceki"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 3L5 7l4 4"/></svg></button>
        <button type="button" class="card-opt-btn" id="calNextBtn" aria-label="Sonraki"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 3l4 4-4 4"/></svg></button>
      </div>
      <button type="button" class="btn btn-outline" id="calTodayBtn" style="padding:4px 12px;font-size:12px;">Bugün</button>
      <div class="calendar-month" id="calMonthLabel"></div>
      <div class="spacer"></div>
      <div class="chart-tabs" id="calViewTabs">
        <button type="button" class="chart-tab cal-viewbtn" data-view="day">Gün</button>
        <button type="button" class="chart-tab cal-viewbtn active" data-view="week">Hafta</button>
        <button type="button" class="chart-tab cal-viewbtn" data-view="month">Ay</button>
        <button type="button" class="chart-tab cal-viewbtn" data-view="year">Yıl</button>
        <button type="button" class="chart-tab cal-viewbtn" data-view="list">Liste</button>
      </div>
    </div>
    <div id="calMainBody"></div>
  </div>

</div>
</main>

<script type="module">
import('/src/v4/calendar.js').then(({ initCalendar }) => { initCalendar(); });
</script>

</body>
</html>
