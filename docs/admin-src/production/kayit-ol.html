<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kayıt ol | Protokol</title>
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <img class="brand-icon" src="/icon-192.png" alt="">
      <div class="brand-name">Protokol</div>
    </div>

    <div class="auth-title">Hesabınızı oluşturun</div>
    <div class="auth-subtitle">Bir dakikadan kısa sürede başlayın.</div>

    <div id="signup-error" class="form-hint" style="display:none;color:var(--red);margin-bottom:12px"></div>

    <form id="signup-form">
      <!-- Kullanıcı isteği: "kayıt ekranında isim, soyisim ayrı şekilde yazılsın ve
           sisteme doğru entegre edilsin." Eskiden tek bir "Ad soyad" kutusu vardı ve
           İLK BOŞLUKTAN bölünüyordu: iki adı olanlarda ("Ali Berk Dereci") soyad
           yanlış çıkıyor, tek kelime yazanda soyad boş kalıyordu. Artık iki ayrı
           zorunlu alan var ve veritabanındaki firstName/lastName ile birebir eşleşiyor. -->
      <div class="form-group">
        <label class="form-label" for="firstName">Ad</label>
        <div class="input-group">
          <svg class="input-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="5" r="3"/><path d="M2 14a6 6 0 0112 0"/></svg>
          <input type="text" id="firstName" class="form-control" placeholder="Adınızı girin" autocomplete="given-name" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="lastName">Soyad</label>
        <div class="input-group">
          <svg class="input-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="5" r="3"/><path d="M2 14a6 6 0 0112 0"/></svg>
          <input type="text" id="lastName" class="form-control" placeholder="Soyadınızı girin" autocomplete="family-name" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">E-posta</label>
        <div class="input-group">
          <svg class="input-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M2 5l6 4 6-4"/></svg>
          <input type="email" id="email" class="form-control" placeholder="E-postanızı girin" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Şifre</label>
        <div class="input-group">
          <svg class="input-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5 7V5a3 3 0 016 0v2"/></svg>
          <input type="password" id="password" class="form-control" placeholder="En az 6 karakter" minlength="6" required>
        </div>
        <div class="form-hint">En az 6 karakter.</div>
      </div>

      <div class="auth-actions" style="justify-content:flex-start">
        <label class="form-check">
          <input type="checkbox" required> Kullanım Şartları'nı ve Gizlilik Politikası'nı kabul ediyorum
        </label>
      </div>

      <button type="submit" id="signup-submit" class="btn btn-primary" style="width:100%;justify-content:center;height:38px">
        Hesap oluştur
      </button>
    </form>

    <div class="auth-footer">
      Zaten bir hesabınız var mı? <a href="giris.html" id="login-link">Giriş yap</a>
    </div>
  </div>
</div>

<script type="module">
// Kullanıcı isteği: Google/GitHub sahte OAuth butonları kaldırıldı (hiçbir sağlayıcı
// kurulu değil, kullanıcıyı yanıltıyordu) -- giris.html'deki AYNI desen: tek giriş/kayıt
// noktası artık bu sayfalar, gerçek firebase.auth() kullanıyor.
const firebaseConfig = {
  apiKey: 'AIzaSyDOfhq3aYW6sg2_zj0sFsRzXeGziGtLxCk',
  authDomain: 'omu-protokol.firebaseapp.com',
  databaseURL: 'https://omu-protokol-default-rtdb.europe-west1.firebasedatabase.app',
  projectId: 'omu-protokol'
};
if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
const auth = firebase.auth();
const database = firebase.database();

// Firebase hata kodlarını genel, kullanıcı-dostu Türkçe metinlere çevir --
// ham Firebase hata metnini kullanıcıya asla gösterme (giris.html'deki aynı desen).
const ERROR_MESSAGES = {
  'auth/email-already-in-use': 'Bu e-posta adresi zaten kayıtlı.',
  'auth/weak-password': 'Şifre çok zayıf, en az 6 karakter olmalı.',
  'auth/invalid-email': 'Geçerli bir e-posta adresi girin.',
  'auth/operation-not-allowed': 'Kayıt sistemi şu anda kapalı.',
  'auth/too-many-requests': 'Çok fazla deneme yapıldı. Lütfen biraz sonra tekrar deneyin.'
};
function messageFor(err) {
  return ERROR_MESSAGES[err && err.code] || 'Kayıt oluşturulamadı. Lütfen tekrar deneyin.';
}

// returnTo desteği giris.html'deki ile birebir aynı -- ana siteden geldiyse kayıt
// sonrası oraya, yoksa admin panosuna döner. Açık yönlendirme riskine karşı sadece
// AYNI origin'e dönülür.
function safeReturnTo() {
  const raw = new URLSearchParams(location.search).get('returnTo');
  if (!raw) { return 'index.html'; }
  try {
    const url = new URL(raw, location.origin);
    return url.origin === location.origin ? url.href : 'index.html';
  } catch (_e) { return 'index.html'; }
}
const returnTo = safeReturnTo();
// "Giriş yap" linkine de returnTo taşınır -- zincir giris.html'deki AYNI desen.
const loginLink = document.getElementById('login-link');
if (loginLink && new URLSearchParams(location.search).get('returnTo')) {
  loginLink.href = 'giris.html?returnTo=' + encodeURIComponent(returnTo);
}

const form = document.getElementById('signup-form');
const submitBtn = document.getElementById('signup-submit');
const errorEl = document.getElementById('signup-error');

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.style.display = '';
}
function hideError() {
  errorEl.style.display = 'none';
}

// Kayıt işlemi sürerken bu bayrak açık kalır -- aşağıdaki açıklamaya bakın.
let kayitSuruyor = false;

// Zaten giriş yapılmışsa tekrar formu göstermeden hedefe yönlendir.
//
// KRİTİK: kayıt SÜRERKEN bu yönlendirme çalışmamalı. createUserWithEmailAndPassword()
// başarılı olur olmaz kullanıcı OTURUM AÇMIŞ sayılır ve onAuthStateChanged hemen
// tetiklenir; burada koşulsuz yönlendirme yapılırsa sayfa, hemen ardından gelen
// users/{uid} yazımı BİTMEDEN kapanıyor ve yazma iptal oluyordu. Sonuç: Auth
// hesabı var, veritabanı kaydı yok -- yani "yetim hesap". Kullanıcının bildirdiği
// "kayıt oldu ama Kullanıcı Yönetimi'nde görünmüyor, onaylayamıyorum" durumunun
// sebebi tam olarak buydu (canlı veritabanında kaydın hiç oluşmadığı doğrulandı).
auth.onAuthStateChanged((user) => {
  if (user && !kayitSuruyor) { window.location.href = returnTo; }
});

form.addEventListener('submit', (e) => {
  e.preventDefault();
  hideError();
  const firstName = document.getElementById('firstName').value.trim();
  const lastName = document.getElementById('lastName').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  kayitSuruyor = true; // otomatik yonlendirme, DB yazimi bitene kadar beklesin
  submitBtn.disabled = true;
  const originalLabel = submitBtn.textContent;
  submitBtn.textContent = 'Kaydediliyor…';

  // İki adım (auth hesabı + users/{uid} kaydı) app.js'teki handleSignup ile AYNI şema:
  // rol her zaman "pending" başlar, bir admin/kurucu onaylayana kadar düzenleme yetkisi yok.
  auth.createUserWithEmailAndPassword(email, password).then((cred) => {
    // Adı ÖNCE Auth profiline yaz. Sebep: kayıt iki adımlı (önce Auth hesabı,
    // sonra veritabanı kaydı) ve ikinci adım koparsa ortada isimsiz bir 'yetim
    // hesap' kalıyordu -- yönetici listesinde '(isim yok)' olarak çıkıyordu.
    // displayName Auth tarafında durduğu için, shell.js'in yetim onarımı ismi
    // oradan geri okuyup kaydı doğru isimle oluşturabiliyor.
    return cred.user.updateProfile({ displayName: (firstName + ' ' + lastName).trim() })
      .catch(() => { /* isim yazılamasa bile kayıt akışı sürsün */ })
      .then(() => database.ref('users/' + cred.user.uid).set({
        firstName, lastName, email, role: 'pending',
        createdAt: firebase.database.ServerValue.TIMESTAMP
      }));
  }).then(() => {
    window.location.href = returnTo;
  }).catch((err) => {
    kayitSuruyor = false;
    console.error('Kayıt başarısız:', err);
    showError(messageFor(err));
    submitBtn.disabled = false;
    submitBtn.textContent = originalLabel;
  });
});
</script>

</body>
</html>
