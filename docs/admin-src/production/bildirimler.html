<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Bildirimler | Protokol</title>
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Ana sitedeki (protokol.sbs) omu-protokol Firebase projesiyle aynı config. app.js'teki
     loadAdminLogs() ile aynı logs/{il,universite,etkinlik,hesap,dictionary} düğümlerini okur --
     bu sayfa o günlüğün salt-okunur, tam listeli hâlidir. -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="notifications" data-breadcrumb="Anasayfa|index.html > Bildirimler">

<main class="main">
<div class="page-wrapper">

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle">Etkinlik geçmişi</div>
        <h1 class="page-title">Bildirimler</h1>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header" style="border-bottom:1px solid var(--border-color-light)">
      <div class="chart-tabs notif-tabs" id="notif-tabs">
        <button class="chart-tab active" data-filter="all">Tümü</button>
        <button class="chart-tab" data-filter="il">İl Protokolü</button>
        <button class="chart-tab" data-filter="universite">Üniversite Protokolü</button>
        <button class="chart-tab" data-filter="etkinlik">Etkinlik Takvimi</button>
        <button class="chart-tab" data-filter="hesap">Hesap</button>
        <button class="chart-tab" data-filter="katilim" id="notif-tab-katilim" hidden>Katılım Talepleri</button>
        <button class="chart-tab" data-filter="kisisel" id="notif-tab-kisisel" hidden>Bildirimlerim</button>
      </div>
    </div>
    <div class="card-body" style="padding:0">
      <div class="notifications-list" id="notif-list">
        <div style="text-align:center;color:var(--text-muted);padding:32px">Yükleniyor…</div>
      </div>
      <div class="notifications-empty" id="notif-empty" hidden>
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3a6 6 0 00-6 6c0 6-3 7-3 7h18s-3-1-3-7a6 6 0 00-6-6z"/></svg>
        <div class="empty-title">Kayıt yok</div>
        <div class="empty-desc">Bu filtreyle eşleşen bir kayıt bulunamadı.</div>
      </div>
    </div>
  </div>

</div>
</main>

<script type="module">
import { dbPath, initDbMode, renderDbModeBanner, onDbModeChange } from '/src/v4/db-mode.js';
import { showToast } from '/src/v4/toast.js';
import { approveAttendanceRequest, rejectAttendanceRequest } from '/src/v4/attendance.js';

const firebaseConfig = {
  apiKey: 'AIzaSyDOfhq3aYW6sg2_zj0sFsRzXeGziGtLxCk',
  authDomain: 'omu-protokol.firebaseapp.com',
  databaseURL: 'https://omu-protokol-default-rtdb.europe-west1.firebasedatabase.app',
  projectId: 'omu-protokol'
};
if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
const database = firebase.database();
const auth = firebase.auth();

const LIST_LABELS = { il: 'İl Protokol Sırası', universite: 'Üniversite Protokol Sırası', etkinlik: 'Etkinlik Takvimi', hesap: 'Hesap', dictionary: 'Veri Sözlüğü' };
const LIST_ICON = { il: 'info', universite: 'info', etkinlik: 'task', hesap: 'alert', dictionary: 'mention' };
const ICON = {
  info:    '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 5v3M8 11h.01"/></svg>',
  task:    '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8l3 3 7-7"/></svg>',
  alert:   '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1l7 13H1L8 1z"/><path d="M8 6v4"/><circle cx="8" cy="12" r="0.5"/></svg>',
  mention: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="3"/><path d="M11 8v1a2 2 0 004 0V8a7 7 0 10-2.7 5.5"/></svg>'
};

const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let ENTRIES = [];
let filter = 'all';

function setState(html) {
  document.getElementById('notif-list').innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:32px">${html}</div>`;
  document.getElementById('notif-empty').hidden = true;
}

function visible() {
  if (filter === 'all') return ENTRIES;
  return ENTRIES.filter((e) => e._list === filter);
}

// Üç ayrı satır şablonu -- ENTRIES artık log kayıtları + katılım talepleri +
// kişisel bildirimlerin TEK bir listede birleşimi (kullanıcı bulgusu: "Tümü"
// sekmesinde katılım talepleri ve kişisel bildirimler hiç görünmüyordu,
// çünkü eskiden bu ikisi ayrı değişkenlerde tutulup SADECE kendi sekmeleri
// seçiliyken render ediliyordu). render() artık e._list'e göre doğru şablonu
// seçip aynı listede karışık gösteriyor.
function renderLogRow(e) {
  const kind = LIST_ICON[e._list] || 'info';
  const timeStr = new Date(e.timestamp || 0).toLocaleString('tr-TR');
  const parts = String(e.action || '').split(' · ');
  const headline = parts.shift() || '';
  const detail = parts.join(' · ');
  return `
    <div class="notification-row">
      <span class="notif-icon notif-${kind}" aria-hidden="true">${ICON[kind]}</span>
      <span class="notif-body">
        <span class="notif-from">${escapeHtml(e.by || e.email || '?')} <span style="color:var(--text-muted);font-weight:400">· ${escapeHtml(LIST_LABELS[e._list] || e._list)}</span></span>
        <span class="notif-text">${e.target ? `<strong>${escapeHtml(e.target)}</strong> ` : ''}${escapeHtml(headline)}${detail ? ` — ${escapeHtml(detail)}` : ''}</span>
      </span>
      <span class="notif-time">${timeStr}</span>
      ${e._bekleyen ? '<a class="btn btn-outline" style="height:26px;padding:0 10px;font-size:12px;white-space:nowrap" href="kullanici-yonetimi.html?filtre=pending">Onayla</a>' : ''}
    </div>
  `;
}
function renderKatilimRow(r) {
  return `
    <div class="notification-row" data-request-id="${escapeHtml(r._id)}">
      <span class="notif-icon notif-task" aria-hidden="true">${ICON.task}</span>
      <span class="notif-body">
        <span class="notif-from">${escapeHtml(r.requestedByName || '?')} <span style="color:var(--text-muted);font-weight:400">talep etti</span></span>
        <span class="notif-text"><strong>${escapeHtml(r.attendeeName || '')}</strong>, ${escapeHtml(r.eventName || 'etkinlik')} etkinliğine ${escapeHtml(r.eventDate || '')} tarihinde ${r.role === 'haberYazanlari' ? 'haber yazarı' : 'basın görevlisi'} olarak gitti olarak eklenmek istiyor.</span>
      </span>
      <span class="notif-time">${r.requestedAt ? new Date(r.requestedAt).toLocaleString('tr-TR') : ''}</span>
      <button type="button" class="btn btn-outline" style="height:26px;padding:0 10px;font-size:12px;white-space:nowrap" data-approve="${escapeHtml(r._id)}">Onayla</button>
      <button type="button" class="btn btn-ghost" style="height:26px;padding:0 10px;font-size:12px;white-space:nowrap;color:var(--red)" data-reject="${escapeHtml(r._id)}">Reddet</button>
    </div>
  `;
}
function renderPersonalRow(n) {
  const tag = n.relatedGameId ? 'a' : 'div';
  const hrefAttr = n.relatedGameId ? ` href="oyun-satranc.html?oyun=${encodeURIComponent(n.relatedGameId)}"` : '';
  return `
    <${tag} class="notification-row${n.read === true ? '' : ' notification-row--unread'}"${hrefAttr}>
      <span class="notif-icon notif-info" aria-hidden="true">${ICON.info}</span>
      <span class="notif-body">
        <span class="notif-from">${escapeHtml(n.title || 'Bildirim')}</span>
        <span class="notif-text">${escapeHtml(n.message || '')}</span>
      </span>
      <span class="notif-time">${n.createdAt ? new Date(n.createdAt).toLocaleString('tr-TR') : ''}</span>
    </${tag}>
  `;
}

function render() {
  const list = document.getElementById('notif-list');
  const empty = document.getElementById('notif-empty');
  const items = visible();
  if (!items.length) {
    list.innerHTML = '';
    empty.hidden = false;
    const emptyMsgs = { katilim: 'Bekleyen katılım talebi yok.', kisisel: 'Henüz bildiriminiz yok.' };
    document.querySelector('#notif-empty .empty-desc').textContent = emptyMsgs[filter] || 'Bu filtreyle eşleşen bir kayıt bulunamadı.';
    return;
  }
  empty.hidden = true;
  list.innerHTML = items.map((e) => {
    if (e._list === 'katilim') return renderKatilimRow(e);
    if (e._list === 'kisisel') return renderPersonalRow(e);
    return renderLogRow(e);
  }).join('');
}

document.getElementById('notif-list').addEventListener('click', (e) => {
  const approveBtn = e.target.closest('[data-approve]');
  const rejectBtn = e.target.closest('[data-reject]');
  if (!approveBtn && !rejectBtn) return;
  const requestId = (approveBtn || rejectBtn).dataset.approve || (approveBtn || rejectBtn).dataset.reject;
  const action = approveBtn
    ? approveAttendanceRequest(database, requestId, currentUid, currentUserName)
    : rejectAttendanceRequest(database, requestId, currentUid, currentUserName);
  (approveBtn || rejectBtn).disabled = true;
  // NOT: onay/red sonrası elle yenileme YOK -- attendanceRequests üzerindeki
  // .on('value') dinleyicisi (bkz. attachAll) status 'pending' olmaktan
  // çıkınca listeyi otomatik günceller.
  action.then(() => {
    showToast(approveBtn ? 'Talep onaylandı.' : 'Talep reddedildi.', { variant: 'success' });
  }).catch((err) => {
    console.error('Talep işlenemedi:', err);
    showToast(err && err.message ? err.message : 'Talep işlenemedi.', { variant: 'error' });
  });
});

// Artık ENTRIES rolüne göre gerçek zamanlı dinleyicilerle güncel tutuluyor
// (bkz. attachAll/attachEditor) -- sekmeye tıklamak sadece client-side filtre
// uyguluyor, yeniden fetch YOK.
document.getElementById('notif-tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.chart-tab');
  if (!btn) return;
  document.querySelectorAll('#notif-tabs .chart-tab').forEach((b) => b.classList.remove('active'));
  btn.classList.add('active');
  filter = btn.dataset.filter;
  render();
});

// Kullanıcı bulgusu: "bildirimler kısmına girince gördüğüm bildirimler
// sağdaki zil işaretinden silinmiyor" -- görüntülenen bildirimler hiçbir
// zaman read:true olarak işaretlenmiyordu, bu yüzden shell.js'teki rozet
// (okunmamış sayısı) sonsuza dek aynı kalıyordu. notifications/{uid}
// dinleyicisi her tetiklenişinde o an listelenen okunmamışlar tek seferlik
// read:true yapılır -- dbPath() ÜZERİNDEN (attendance.js'in yazdığı yolla AYNI dal).
function markNotificationsRead(idToItem) {
  const updates = {};
  Object.keys(idToItem).forEach((id) => {
    if (idToItem[id] && idToItem[id].read !== true) {
      updates[dbPath('notifications/' + currentUid + '/' + id + '/read')] = true;
    }
  });
  if (Object.keys(updates).length) {
    database.ref('/').update(updates).catch((err) => console.error('Bildirimler okundu olarak işaretlenemedi:', err));
  }
}

// ── Admin/owner: TÜM kaynaklar (loglar + bekleyen kayıtlar + katılım
// talepleri + kişisel bildirimler) GERÇEK ZAMANLI .on('value') dinleyicileriyle
// ayrı "kova"larda tutulup her değişiklikte ENTRIES'te yeniden birleştirilir.
// Kullanıcı bulgusu: "Tümü sekmesi açıkken bildirimler anlık olarak düşmüyor"
// -- eskiden .once('value') ile TEK SEFERLİK çekiliyordu, sayfa açıkken gelen
// yeni bir kayıt sayfa yenilenmeden asla görünmüyordu. Artık her kova kendi
// canlı dinleyicisiyle güncelleniyor.
const LOG_LISTS = ['il', 'universite', 'etkinlik', 'hesap', 'dictionary'];
let logRefs = {};
let usersRef = null;
let attendanceRef = null;
let personalRef = null;
let LOG_BUCKETS = { il: [], universite: [], etkinlik: [], hesap: [], dictionary: [] };
let PENDING_ACCOUNTS = [];
let KATILIM_BUCKET = [];
let KISISEL_BUCKET = [];
let usersVal = {};

function bekleyenKayitlariHesapla() {
  // Rolü editor/admin/owner OLMAYAN her kayıt 'onay bekliyor' demektir.
  // Onay bekleyen KAYIT TALEPLERİ bu listeye giriyor (kullanıcı isteği:
  // "yeni kullanıcı onay bekliyor diye bildirim gelmeli, kişinin tüm bilgileri:
  // ismi, hangi e-postayla, hangi saatte kayıt yapıp onay beklediği").
  // logs/hesap'a yazılamıyor çünkü log yazma yetkisi editor/admin/owner'da;
  // kayıt olan kişi ise henüz 'pending'. Bu yüzden kayıtlar doğrudan users/
  // düğümünden türetiliyor -- bu sayfa zaten yalnızca admin/owner'a açık.
  const ONAYLI = ['editor', 'admin', 'owner'];
  PENDING_ACCOUNTS = Object.keys(usersVal)
    .filter((uid) => ONAYLI.indexOf(usersVal[uid] && usersVal[uid].role) === -1)
    .map((uid) => {
      const k = usersVal[uid] || {};
      const isim = ((k.firstName || '') + ' ' + (k.lastName || '')).trim() || '(isim girilmemiş)';
      return {
        _list: 'hesap', _bekleyen: true, by: isim, email: k.email || '', target: k.email || isim,
        action: 'Yeni kayıt talebi · onay bekliyor', timestamp: k.createdAt || 0
      };
    });
}

function rebuildEntries() {
  const loglar = LOG_LISTS.flatMap((list) => LOG_BUCKETS[list]);
  ENTRIES = loglar.concat(PENDING_ACCOUNTS).concat(KATILIM_BUCKET).concat(KISISEL_BUCKET)
    .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0))
    .slice(0, 150);
  if (!ENTRIES.length) { setState('Henüz kayıt yok.'); return; }
  render();
}

function detachAll() {
  if (usersRef) { usersRef.off('value'); usersRef = null; }
  LOG_LISTS.forEach((list) => { if (logRefs[list]) { logRefs[list].off('value'); logRefs[list] = null; } });
  if (attendanceRef) { attendanceRef.off('value'); attendanceRef = null; }
  if (personalRef) { personalRef.off('value'); personalRef = null; }
}

function attachAll() {
  detachAll();
  setState('Yükleniyor…');
  usersRef = database.ref('users');
  usersRef.on('value', (snap) => {
    usersVal = snap.val() || {};
    bekleyenKayitlariHesapla();
    rebuildEntries();
  }, (err) => console.error('Kullanıcılar okunamadı:', err));

  LOG_LISTS.forEach((list) => {
    logRefs[list] = database.ref(dbPath('logs/' + list)).limitToLast(50);
    logRefs[list].on('value', (snap) => {
      LOG_BUCKETS[list] = Object.values(snap.val() || {}).map((e) => ({ ...e, _list: list }));
      rebuildEntries();
    }, (err) => console.error('logs/' + list + ' okunamadı:', err));
  });

  attendanceRef = database.ref(dbPath('attendanceRequests')).orderByChild('status').equalTo('pending');
  attendanceRef.on('value', (snap) => {
    const val = snap.val() || {};
    KATILIM_BUCKET = Object.keys(val).map((id) => Object.assign({ _id: id }, val[id], { _list: 'katilim', timestamp: val[id].requestedAt }));
    rebuildEntries();
  }, (err) => console.error('Katılım talepleri okunamadı:', err));

  personalRef = database.ref(dbPath('notifications/' + currentUid)).limitToLast(50);
  personalRef.on('value', (snap) => {
    const val = snap.val() || {};
    KISISEL_BUCKET = Object.entries(val).map(([id, n]) => Object.assign({ _id: id }, n, { _list: 'kisisel', timestamp: n.createdAt }));
    rebuildEntries();
    markNotificationsRead(val);
  }, (err) => console.error('Bildirimler okunamadı:', err));
}

// ── Editör: SADECE kendi kişisel bildirimleri (notifications/{uid}), gerçek
// zamanlı. KRİTİK: editör için logs/* düğümlerine HİÇ dokunulmuyor -- indirip
// arayüzde gizlemek yerine, bu rol dalı o kod yolunu hiç çalıştırmıyor
// (Firebase kuralları da zaten editöre logs/* okumasını engelliyor). Editörün
// görünen tek sekmesi "Tümü" zaten bu listeye eşit.
function attachEditor() {
  detachAll();
  setState('Yükleniyor…');
  personalRef = database.ref(dbPath('notifications/' + currentUid)).limitToLast(50);
  personalRef.on('value', (snap) => {
    const val = snap.val() || {};
    ENTRIES = Object.entries(val)
      .map(([id, n]) => Object.assign({ _id: id }, n, { _list: 'kisisel', timestamp: n.createdAt }))
      .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
    if (!ENTRIES.length) { setState('Henüz bildiriminiz yok.'); return; }
    render();
    markNotificationsRead(val);
  }, (err) => console.error('Bildirimler okunamadı:', err));
}

let authorized = false;
let modeReady = false;
let currentUid = '';
let currentUserName = '';
let currentRole = '';
auth.onAuthStateChanged((user) => {
  if (!user) { setState('Bu sayfayı görüntülemek için giriş yapmış olmanız gerekir.'); return; }
  currentUid = user.uid;
  database.ref('users/' + user.uid).once('value').then((snap) => {
    const u = snap.val() || {};
    const role = u.role;
    currentRole = role;
    currentUserName = ((u.firstName || '') + ' ' + (u.lastName || '')).trim() || (user.email || '');
    if ((role === 'admin' || role === 'owner') && u.blocked !== true) {
      authorized = true;
      document.getElementById('notif-tab-katilim').hidden = false;
      // Admin/owner'ın da kendi notifications/{uid} bildirimleri olabilir (ör.
      // kendi gönderdiği bir katılım talebinin onay/red sonucu) -- eskiden bunu
      // görüp okundu işaretleyecek HİÇBİR yer yoktu, zil rozeti sonsuza dek
      // aynı kalıyordu (kullanıcı bulgusu: "adminde de bunlar olmuyor").
      document.getElementById('notif-tab-kisisel').hidden = false;
      initDbMode(database).then(() => { modeReady = true; renderDbModeBanner(); attachAll(); });
    } else if (role === 'editor' && u.blocked !== true) {
      // Editöre yönetim sekmeleri (İl/Üniversite/Etkinlik/Hesap/Katılım
      // Talepleri) hiç GÖSTERİLMİYOR -- sadece "Tümü" sekmesi kalır ve o da
      // kişisel bildirimlerini listeler.
      authorized = true;
      ['il', 'universite', 'etkinlik', 'hesap'].forEach((f) => {
        const el = document.querySelector(`#notif-tabs [data-filter="${f}"]`);
        if (el) { el.hidden = true; }
      });
      initDbMode(database).then(() => { modeReady = true; renderDbModeBanner(); attachEditor(); });
    } else {
      setState('Bildirimler yalnızca onaylı editör/admin/kurucu rolündeki kullanıcılara açıktır.');
    }
  }).catch((err) => {
    console.error('Yetki kontrol edilemedi:', err);
    setState('Yetki kontrol edilemedi.');
  });
});

// Test Modu açılıp kapanınca (başka bir sekmeden bile olsa) dbPath() değişir --
// eski dala bağlı dinleyiciler artık YANLIŞ dalı izler, bu yüzden hepsi
// kapatılıp doğru dala yeniden bağlanır.
onDbModeChange(() => {
  if (!modeReady) {return;}
  renderDbModeBanner();
  if (!authorized) {return;}
  if (currentRole === 'editor') { attachEditor(); }
  else { attachAll(); }
});
</script>

</body>
</html>
