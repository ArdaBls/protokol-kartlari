<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dashboard | Protokol</title>
<link rel="icon" href="/images/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- Ana sitedeki (protokol.sbs) omu-protokol Firebase projesiyle aynı config -- bkz. charts.js editorEventActivity(). -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="dashboard" data-breadcrumb="Home > Dashboard">

<main class="main">
<div class="page-wrapper">

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle">Overview</div>
        <h1 class="page-title">Dashboard</h1>
      </div>
    </div>
  </div>

  <!-- ── STAT CARDS ── -->
  <div class="row col-3">
    <div class="card">
      <div class="stat">
        <div class="stat-icon teal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        </div>
        <div class="stat-content">
          <div class="stat-label">Total Users</div>
          <div class="stat-value-row">
            <span class="stat-value">2,500</span>
            <span class="stat-change up"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V3M3 6l3-3 3 3"/></svg>12%</span>
          </div>
          <div class="stat-subtext">342 new this week</div>
        </div>
        <div class="stat-spark">
          <div class="bar" style="height:40%"></div><div class="bar" style="height:55%"></div><div class="bar" style="height:45%"></div><div class="bar" style="height:60%"></div><div class="bar" style="height:50%"></div><div class="bar" style="height:70%"></div><div class="bar" style="height:65%"></div><div class="bar" style="height:80%"></div><div class="bar" style="height:75%"></div><div class="bar" style="height:90%"></div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="stat">
        <div class="stat-icon purple">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        </div>
        <div class="stat-content">
          <div class="stat-label">Sayaç <button type="button" class="countdown-edit-btn" data-countdown-edit aria-label="Hedef tarihi ayarla"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9.5 2l2.5 2.5-7 7-3 .5.5-3 7-7z"/></svg></button><button type="button" class="countdown-edit-btn" data-countdown-reset aria-label="Sayacı sıfırla"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 3.5h9M5.5 3.5V2h3v1.5M3.5 3.5l.5 8.5h6l.5-8.5"/></svg></button></div>
          <div class="stat-value-row">
            <span class="stat-value" data-countdown-value style="font-size:20px">—</span>
          </div>
          <div class="stat-subtext" data-countdown-sub>Hedef tarih belirlenmedi</div>
        </div>
      </div>
      <div style="padding:0 16px 12px">
        <div class="progress-thin"><div class="bar" data-countdown-bar style="width:0%;background:var(--purple)"></div></div>
      </div>
    </div>
    <div class="card">
      <div class="stat">
        <div class="stat-icon azure">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>
        </div>
        <div class="stat-content">
          <div class="stat-label">Tahmini Çekilen Fotoğraf</div>
          <div class="stat-value-row">
            <span class="stat-value" data-photo-counter>—</span>
          </div>
          <div class="stat-subtext">Basın görevlisi olarak gidilen etkinliklere göre (tahmini)</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── CHART + TASKS ROW ── -->
  <div class="row col-8-4">
    <div class="card" style="display:flex;flex-direction:column;height:402px">
      <div class="card-header">
        <div>
          <div class="card-title">Editör Aktivitesi</div>
          <div class="card-subtitle" data-editor-activity-subtitle>Basın görevlisi olarak atandıkları etkinlik sayısı, aylık · Ocak – Aralık</div>
        </div>
        <div class="card-options">
          <button type="button" class="chart-view-toggle" data-chart-view-toggle aria-label="Kişilere göre etkinlik payını göster">%</button>
        </div>
      </div>
      <div class="chart-area" data-chart-view="line" style="flex:1;min-height:0">
        <div data-chart="editor-event-activity" style="width:100%;height:100%"></div>
      </div>
      <div class="chart-area" data-chart-view="share" style="flex:1;min-height:0;display:none">
        <div class="donut-block" style="height:100%;align-items:center;justify-content:center;padding:0 16px;gap:40px">
          <div class="donut-svg" style="width:260px;height:260px;flex:0 0 260px;margin-right:24px">
            <div data-chart="editor-activity-share" style="width:100%;height:100%"></div>
            <div class="donut-center-label">
              <div class="num">—</div>
              <div class="sub">yüzde</div>
            </div>
          </div>
          <div class="donut-legend donut-legend--lg" style="flex:0 0 auto;width:280px"></div>
        </div>
      </div>
    </div>

    <!-- To-Do — gerçek Firebase verisi, bkz. tasks-widget.js -->
    <div class="card" style="display:flex;flex-direction:column;height:402px">
      <div class="card-header">
        <div>
          <div class="card-title">Tasks</div>
          <div class="card-subtitle" data-todo-counter>Yükleniyor…</div>
        </div>
        <div class="card-options">
          <button type="button" class="card-opt-btn" data-task-add aria-label="Yeni görev ekle"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 2v10M2 7h10"/></svg></button>
        </div>
      </div>
      <div class="card-body" data-task-list style="padding:8px 16px;flex:1;min-height:0;overflow-y:auto"></div>
    </div>
  </div>


</div>
</main>

</body>
</html>
