<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Şifremi unuttum | Protokol</title>
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <img class="brand-icon" src="/icons/icon-192.png" alt="">
      <div class="brand-name">Protokol</div>
    </div>

    <div class="auth-title">Şifrenizi mi unuttunuz?</div>
    <div class="auth-subtitle">E-posta adresinizi girin, size bir sıfırlama bağlantısı gönderelim.</div>

    <div id="reset-error" class="form-hint" role="alert" aria-live="assertive" aria-atomic="true" style="color:var(--red);margin-bottom:0"></div>

    <form id="reset-form">
      <div class="form-group">
        <label class="form-label" for="email">E-posta</label>
        <div class="input-group">
          <svg class="input-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M2 5l6 4 6-4"/></svg>
          <input type="email" id="email" class="form-control" aria-describedby="reset-error" placeholder="E-posta adresiniz" required>
        </div>
      </div>

      <button type="submit" id="reset-submit" class="btn btn-primary" style="width:100%;justify-content:center;height:38px">
        Sıfırlama bağlantısı gönder
      </button>
    </form>

    <div class="auth-divider">veya</div>

    <div style="text-align:center">
      <a href="giris.html" class="btn btn-outline" style="display:inline-flex;justify-content:center">
        ← Giriş sayfasına dön
      </a>
    </div>

    <div class="auth-success" id="reset-success" role="status" aria-live="polite" hidden>
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/>
      </svg>
      <div class="success-title">E-postanızı kontrol edin</div>
      <div class="success-desc"><strong id="reset-email"></strong> adresine şifre sıfırlama bağlantısı gönderdik.</div>
    </div>

    <div class="auth-footer">
      Hesabınız yok mu? <a href="kayit-ol.html">Hesap oluşturun</a>
    </div>
  </div>
</div>

<script type="module">
const firebaseConfig = {
  apiKey: 'AIzaSyDOfhq3aYW6sg2_zj0sFsRzXeGziGtLxCk',
  authDomain: 'omu-protokol.firebaseapp.com',
  databaseURL: 'https://omu-protokol-default-rtdb.europe-west1.firebasedatabase.app',
  projectId: 'omu-protokol'
};
if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
const auth = firebase.auth();
auth.languageCode = 'tr';
const form = document.getElementById('reset-form');
const submitBtn = document.getElementById('reset-submit');
const errorEl = document.getElementById('reset-error');

function showError(message) {
  errorEl.textContent = message;
  errorEl.style.marginBottom = '12px';
}
function hideError() {
  errorEl.textContent = '';
  errorEl.style.marginBottom = '0';
}
form.addEventListener('submit', (e) => {
  e.preventDefault();
  e.stopPropagation();
  const email = document.getElementById('email').value.trim();
  if (!email) { return; }
  hideError();
  submitBtn.disabled = true;
  const originalLabel = submitBtn.textContent;
  submitBtn.textContent = 'Gönderiliyor…';
  auth.sendPasswordResetEmail(email).then(() => {
    document.getElementById('reset-email').textContent = email;
    form.hidden = true;
    document.querySelector('.auth-divider').hidden = true;
    document.getElementById('reset-success').hidden = false;
  }).catch((err) => {
    console.error('Şifre sıfırlama bağlantısı gönderilemedi:', err);
    const message = err && err.code === 'auth/invalid-email'
      ? 'Geçerli bir e-posta adresi girin.'
      : err && err.code === 'auth/too-many-requests'
        ? 'Çok fazla deneme yapıldı. Lütfen biraz sonra tekrar deneyin.'
        : 'Sıfırlama bağlantısı gönderilemedi. Lütfen tekrar deneyin.';
    showError(message);
    submitBtn.disabled = false;
    submitBtn.textContent = originalLabel;
  });
});
</script>

</body>
</html>
