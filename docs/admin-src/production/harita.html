<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Birim haritası | Protokol</title>
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin>
<!-- Ana sitedeki (protokol.sbs) omu-protokol Firebase projesiyle aynı config.
     GÜVENLİK KURALLARI GÜNCEL DEĞİL: etkinlikler artık herkese açık DEĞİL, okuma
     giriş yapmış editor/admin/owner rolüyle sınırlı (bkz. firebase-database-rules.json).
     Sayfanın kendi script'i (harita.js) bu yüzden firebase.auth() ile oturum bekliyor
     -- ama firebase-auth-compat.js BURADA HİÇ YÜKLENMİYORDU, "firebase.auth is not
     a function" hatasıyla script en baştan çöküyor ve noktalar/fakülte listesi hiç
     render edilmiyordu (3 Eylül 2026'da bulundu/düzeltildi). -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="map" data-breadcrumb="Anasayfa|index.html > Harita">

<main class="main">
<div class="page-wrapper">

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle">Etkinlikler</div>
        <h1 class="page-title">Birim etkinlik haritası</h1>
      </div>
      <div class="page-actions">
        <select class="form-control" id="year-select" style="width:120px;height:32px"></select>
      </div>
    </div>
  </div>

  <div class="row col-8-4 map-row">
    <div class="card map-card">
      <div id="map" style="border-radius:var(--radius-lg)"></div>
    </div>

    <div class="card map-card">
      <div class="card-header"><div><div class="card-title">Birimler</div><div class="card-subtitle" id="year-sub">Etkinlik sayısına göre</div></div></div>
      <div class="card-body" style="padding:8px 16px;overflow-y:auto" id="unit-list">
        <div style="text-align:center;color:var(--text-muted);padding:24px">Yükleniyor…</div>
      </div>
    </div>
  </div>

</div>
</main>

<script type="module">
import { UNIT_COORDS, resolveUnitName } from '/src/v4/unit-coords.js';

const firebaseConfig = {
  apiKey: 'AIzaSyDOfhq3aYW6sg2_zj0sFsRzXeGziGtLxCk',
  authDomain: 'omu-protokol.firebaseapp.com',
  databaseURL: 'https://omu-protokol-default-rtdb.europe-west1.firebasedatabase.app',
  projectId: 'omu-protokol'
};
if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
const database = firebase.database();

const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Sabit boyutlu daire (piksel cinsinden, zoom'dan bağımsız) + say gittikçe kırmızıya
// giden bir renk skalası -- fakülteler kampüste birbirine yakın olduğu için büyüyen
// daireler üst üste biner, renk skalası çakışmadan yoğunluğu gösterir.
const MARKER_RADIUS = 15;
function colorForCount(count, max) {
  if (!count) return '#9ca3af'; // gri: bu birimde bu yıl hiç etkinlik yok
  const t = max > 0 ? count / max : 0;
  // #fde68a (açık amber) -> #b91c1c (koyu kırmızı)
  const from = [253, 230, 138], to = [185, 28, 28];
  const rgb = from.map((c, i) => Math.round(c + (to[i] - c) * t));
  return `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
}

let allEvents = [];
let map, markers = {};

function populateYearSelect() {
  const years = new Set(allEvents.map((e) => (e.tarih || '').slice(0, 4)).filter(Boolean));
  const thisYear = String(new Date().getFullYear());
  years.add(thisYear);
  const sorted = Array.from(years).sort().reverse();
  const sel = document.getElementById('year-select');
  sel.innerHTML = sorted.map((y) => `<option value="${y}">${y}</option>`).join('');
  sel.value = sorted.includes(thisYear) ? thisYear : sorted[0];
  sel.addEventListener('change', render);
}

function countsForYear(year) {
  const counts = {};
  allEvents.forEach((e) => {
    if ((e.tarih || '').slice(0, 4) !== year) return;
    const unit = resolveUnitName(e.birim);
    if (!unit) return;
    counts[unit] = (counts[unit] || 0) + 1;
  });
  return counts;
}

function render() {
  const year = document.getElementById('year-select').value;
  const counts = countsForYear(year);
  const max = Math.max(0, ...Object.values(counts));

  // Koordinatı olan TÜM birimler haritada görünür (0 etkinlik = gri), böylece dağılım
  // ve "en yoğun nerede" bir arada okunur.
  Object.values(markers).forEach((m) => map.removeLayer(m));
  markers = {};
  Object.entries(UNIT_COORDS).forEach(([unit, coords]) => {
    const count = counts[unit] || 0;
    const marker = L.circleMarker(coords, {
      radius: MARKER_RADIUS,
      color: colorForCount(count, max),
      fillColor: colorForCount(count, max),
      fillOpacity: 0.75,
      weight: 2
    }).addTo(map).bindPopup(`<strong>${escapeHtml(unit)}</strong><br>${year}: ${count} etkinlik`);
    markers[unit] = marker;
  });

  const noCoord = Object.keys(countsForYear(year)).filter((u) => !UNIT_COORDS[u]);

  const rows = Object.keys(UNIT_COORDS)
    .map((u) => ({ u, n: counts[u] || 0 }))
    .sort((a, b) => b.n - a.n || a.u.localeCompare(b.u, 'tr'));

  document.getElementById('year-sub').textContent = `${year} · Etkinlik sayısına göre`;
  document.getElementById('unit-list').innerHTML =
    rows.map((r) => `
      <div class="visitor-row" data-unit="${escapeHtml(r.u)}" style="cursor:pointer">
        <span class="visitor-name">${escapeHtml(r.u)}</span>
        <span class="visitor-pct">${r.n}</span>
        <div class="visitor-bar"><div class="fill" style="width:${max ? Math.round((r.n / max) * 100) : 0}%;background:${colorForCount(r.n, max)}"></div></div>
      </div>
    `).join('')
    + (noCoord.length ? `<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border-color-light);font-size:11.5px;color:var(--text-muted)">Konumu bilinmeyen: ${noCoord.map(escapeHtml).join(', ')}</div>` : '');
}

document.getElementById('unit-list').addEventListener('click', (e) => {
  const row = e.target.closest('[data-unit]');
  if (!row) return;
  const unit = row.dataset.unit;
  const coords = UNIT_COORDS[unit];
  const marker = markers[unit];
  if (!coords || !marker) return;
  map.flyTo(coords, 16, { duration: 0.6 });
  marker.openPopup();
});

// Bilinen Leaflet sorunu: #map kutusu Leaflet ilk kez ölçtüğünde henüz gerçek
// boyutuna oturmamışsa (flex/grid yerleşimi henüz çözülmemiş, sidebar geç
// yerleşiyor, font yükleniyor vb.) harita devasa bir transform/scale ile
// "kaçık" görünür (translate3d(...) scale(8192/16384) gibi) -- SADECE
// invalidateSize() ile SONRADAN düzeltmeye çalışmak yetmiyor, çünkü Leaflet
// zoom/pan durumunu o hatalı ilk ölçüme göre zaten kilitliyor. Bunun yerine
// #map GERÇEKTEN ölçülebilir bir boyuta (clientHeight>0) oturana kadar
// haritayı hiç oluşturmuyoruz -- birkaç kare beklemek genelde yeterli.
function waitForRealSize(el, cb, tries) {
  tries = tries || 0;
  if (el.clientHeight > 40 || tries > 40) { cb(); return; }
  requestAnimationFrame(() => waitForRealSize(el, cb, tries + 1));
}

import('leaflet').then(({ default: LeafletLib }) => {
  window.L = LeafletLib;
  const mapEl = document.getElementById('map');
  waitForRealSize(mapEl, () => {
    // Kampüs ölçeğinde başlar ama TÜM yerleşkeyi kapsayacak kadar geniş: zoom 14
    // OMÜ Kurupelit yerleşkesinin bir kısmını kadraj dışında bırakıyordu (kullanıcı
    // isteği: "biraz daha geniş plandan görelim ama çok uzak olmasın") -- 12 (şehir
    // ölçeği) ile 14 (çok yakın) arasında, kampüsün bütünü görünür kalan 13'e çekildi.
    map = L.map('map').setView([41.3641, 36.1946], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 18
    }).addTo(map);

    const fixSize = () => map.invalidateSize();
    requestAnimationFrame(fixSize);
    setTimeout(fixSize, 250);
    window.addEventListener('resize', fixSize);
    document.querySelector('.sidebar-toggle')?.addEventListener('click', () => setTimeout(fixSize, 300));
    // Flex/grid yerleşimi rAF'lardan SONRA da (ör. fontlar/veriler yüklenince
    // kart yüksekliği değişince) kayabilir -- ResizeObserver her gerçek boyut
    // değişiminde invalidateSize()'ı tetikleyerek bunu kalıcı olarak yakalar.
    new ResizeObserver(fixSize).observe(mapEl);

    loadEvents();
  });
});

function loadEvents() {
  // OTURUM HAZIR OLANA KADAR BEKLE.
  // Bu sayfa eskiden etkinlikleri sayfa açılır açılmaz okuyordu; etkinlikler
  // düğümü o zaman herkese açıktı (".read": true) ve sorun çıkmıyordu. Okuma
  // artık onaylı rol istediği için, Firebase Auth oturumu geri YÜKLEMEDEN atılan
  // istek PERMISSION_DENIED alıyor ve sayfa "Etkinlikler yüklenemedi." deyip
  // bir daha denemiyordu (kullanıcı bildirimi: haritadaki daireler hiç çıkmıyor).
  // onAuthStateChanged ilk kez OTURUM ÇÖZÜLDÜKTEN sonra tetiklenir -- doğru an budur.
  firebase.auth().onAuthStateChanged((user) => {
    if (!user) { return; } // giriş yoksa shell.js zaten giris.html'e yönlendiriyor
    etkinlikleriOku();
  });
}

function etkinlikleriOku() {
  database.ref('etkinlikler').once('value').then((snap) => {
    allEvents = Object.values(snap.val() || {});
    populateYearSelect();
    render();
    map.invalidateSize();
  }).catch((err) => {
    console.error('Etkinlikler yüklenemedi:', err);
    document.getElementById('unit-list').innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:24px">Etkinlikler yüklenemedi.</div>';
  });
}
</script>

</body>
</html>
