<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kişiler | Protokol</title>
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Ana sitedeki (protokol.sbs) omu-protokol Firebase projesiyle aynı config. Bu panel admin/
     alt-yolunda aynı origin'de servis edildiği için, kullanıcı ana siteye zaten giriş yapmışsa
     Firebase Auth oturumu buraya da otomatik taşınır. Admin/owner için Kullanıcı yönetimi
     sayfasıyla aynı "users" düğümünü (salt-okunur, kart görünümlü) okur; editör için ise
     users/ yerine herkese açık staffProfiles/{uid} (yalnızca ad+fotoğraf) okunur -- kullanıcı
     isteği: "editörler de sitede kaç kişi var görebilsin", e-posta/rol editöre YİNE sızmaz. -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="users" data-breadcrumb="Anasayfa|index.html > Kişiler">

<main class="main">
<div class="page-wrapper">

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle">Yönetim</div>
        <h1 class="page-title">Kişiler</h1>
      </div>
    </div>
  </div>

  <div class="row col-3" id="contacts-grid">
    <div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:32px">Yükleniyor…</div>
  </div>

</div>
</main>

<script type="module">
import { dbPath, initDbMode, renderDbModeBanner, onDbModeChange } from '/src/v4/db-mode.js';
import { isSafeAvatarUrl } from '/src/v4/staff-profiles.js';

const firebaseConfig = {
  apiKey: 'AIzaSyDOfhq3aYW6sg2_zj0sFsRzXeGziGtLxCk',
  authDomain: 'omu-protokol.firebaseapp.com',
  databaseURL: 'https://omu-protokol-default-rtdb.europe-west1.firebasedatabase.app',
  projectId: 'omu-protokol'
};
if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
const database = firebase.database();
const auth = firebase.auth();

const ROLE_LABEL = { pending: 'Onay Bekliyor', editor: 'Editör', admin: 'Admin', owner: 'Kurucu' };
const ROLE_COLOR = {
  pending: 'linear-gradient(135deg,var(--yellow),#c97f00)',
  editor:  'linear-gradient(135deg,var(--blue),#0550a0)',
  admin:   'linear-gradient(135deg,var(--red),#a82b2b)',
  owner:   'linear-gradient(135deg,var(--purple),#8a2da0)'
};

const grid = document.getElementById('contacts-grid');
const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function setState(html) {
  grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:32px">${html}</div>`;
}

function fullNameOf(u) {
  return ((u.firstName || '') + ' ' + (u.lastName || '')).trim() || '(isim yok)';
}

// etkinlikler/{id}.gorevli ve .haberYazanlari, admin panelindeki "Basın Görevlisi Bazında
// Takip" / "Haber Yazarı Bazında Takip" istatistikleriyle (bkz. app.js loadAdminStats) AYNI
// biçimde virgülle ayrılmış isim listesidir -- burada da isim eşleşmesiyle sayılır.
function parseNameList(s) {
  return String(s || '').split(',').map((x) => x.trim()).filter(Boolean);
}

function countByName(events, field) {
  const counts = {};
  events.forEach((e) => { parseNameList(e && e[field]).forEach((name) => { counts[name] = (counts[name] || 0) + 1; }); });
  return counts;
}

function render(users, events) {
  const uids = Object.keys(users);
  if (!uids.length) { setState('Henüz kayıtlı kullanıcı yok.'); return; }

  const eventList = Object.values(events);
  const gorevliCounts = countByName(eventList, 'gorevli');
  const haberCounts = countByName(eventList, 'haberYazanlari');

  uids.sort((a, b) => fullNameOf(users[a]).localeCompare(fullNameOf(users[b]), 'tr'));

  grid.innerHTML = uids.map((uid) => {
    const u = users[uid];
    const role = u.role || 'pending';
    const name = fullNameOf(u);
    const initial = name.charAt(0).toUpperCase() || '?';
    const etkinlikSayisi = gorevliCounts[name] || 0;
    const haberSayisi = haberCounts[name] || 0;
    // Admin/owner zaten users/{uid}'yi tam okuyabiliyor -- avatarUrl de orada,
    // kullanıcı isteği: "kişiler sekmesinde de herkes birbirinin profil
    // fotoğrafını görüntüleyebilsin" (yalnızca editör görünümünde değil).
    const hasPhoto = isSafeAvatarUrl(u.avatarUrl);
    // KRİTİK: style niteliği ÇİFT TIRNAKLA sarılı (style="...") -- içine LİTERAL
    // " konursa HTML ayrıştırıcı niteliği ORADA erken kapatır, geri kalan her şey
    // (base64 veri dahil) bozulur ve arka plan resmi hiç uygulanmaz (kullanıcı
    // bulgusu: "sadece resim ekleyenler boş gözüküyor"). &quot; kullanılmalı
    // (bkz. staff-profiles.js renderStaffAvatar'daki AYNI çözüm).
    const avStyle = hasPhoto
      ? `background-image:url(&quot;${String(u.avatarUrl).replace(/["'()]/g, '')}&quot;)`
      : `background:${ROLE_COLOR[role] || ROLE_COLOR.pending}`;
    return `
      <div class="contact-card">
        <div class="av${hasPhoto ? ' has-photo' : ''}" style="${avStyle}">${hasPhoto ? '' : escapeHtml(initial)}</div>
        <div class="name">${escapeHtml(name)}</div>
        <div class="role">${escapeHtml(ROLE_LABEL[role] || role)}</div>
        <div style="font-size:12px;color:var(--text-muted);word-break:break-word;margin-bottom:12px">${escapeHtml(u.email || '')}</div>
        <div class="stats">
          <div><strong>${etkinlikSayisi}</strong>Etkinlik</div>
          <div><strong>${haberSayisi}</strong>Haber</div>
        </div>
      </div>
    `;
  }).join('');
}

// staffProfiles/{uid} SADECE kişi profil.html/ayarlar.html'de adını/fotoğrafını
// kaydettiğinde oluşuyor -- çoğu kullanıcı henüz hiç oraya girmediyse editörün
// gördüğü liste neredeyse boş kalır (kullanıcı bulgusu: "editörlerde kişi
// kartları gözükmüyordu"). Admin/owner zaten TÜM users/ listesini okuyabildiği
// için, Kişiler sayfasını her açtığında eksik staffProfiles kayıtlarını
// (yalnızca ad + varsa mevcut avatarUrl) SESSİZCE geri dolduruyor -- editör bir
// sonraki ziyaretinde tam listeyi görür, e-posta/rol yine hiç yazılmıyor/sızmıyor.
function backfillStaffProfiles(users) {
  database.ref('staffProfiles').once('value').then((snap) => {
    const existing = snap.val() || {};
    const updates = {};
    Object.keys(users).forEach((uid) => {
      const u = users[uid];
      if (!u || (u.role !== 'editor' && u.role !== 'admin' && u.role !== 'owner')) { return; }
      const mevcut = existing[uid];
      // KRİTİK: sadece TAMAMEN eksik kayıtları değil, FOTOĞRAFI eksik olanları
      // da tamamla -- shell.js her sayfada (Kişiler'den önce) çalışıp SADECE
      // displayName ile bir kayıt oluşturabiliyor; o zaman "zaten var" deyip
      // atlarsak fotoğraf hiç eklenmiyor (kullanıcı bulgusu: "editörler adminin/
      // kurucunun fotoğrafını göremiyor").
      if (!mevcut) {
        updates['staffProfiles/' + uid + '/displayName'] = fullNameOf(u);
        if (isSafeAvatarUrl(u.avatarUrl)) { updates['staffProfiles/' + uid + '/avatarUrl'] = u.avatarUrl; }
      } else if (!isSafeAvatarUrl(mevcut.avatarUrl) && isSafeAvatarUrl(u.avatarUrl)) {
        updates['staffProfiles/' + uid + '/avatarUrl'] = u.avatarUrl;
      }
    });
    if (Object.keys(updates).length) {
      database.ref('/').update(updates).catch((err) => console.error('staffProfiles geri doldurulamadı:', err));
    }
  }).catch((err) => console.error('staffProfiles okunamadı (geri doldurma atlandı):', err));
}

function loadUsersAndEvents() {
  setState('Yükleniyor…');
  Promise.all([
    database.ref('users').once('value'),
    database.ref(dbPath('etkinlikler')).once('value')
  ]).then(([usersSnap, eventsSnap]) => {
    const users = usersSnap.val() || {};
    render(users, eventsSnap.val() || {});
    backfillStaffProfiles(users);
  }).catch((err) => {
    console.error('Veriler yüklenemedi:', err);
    setState('Veriler yüklenemedi.');
  });
}

// ── Editör görünümü: users/ (e-posta/rol -- editöre kapalı) YERİNE, herkese
// açık staffProfiles/{uid} (yalnızca ad + fotoğraf) okunur. Kullanıcı isteği:
// "editörler de sitede kaç kişi var görebilsin" -- amaç sayı ve fotoğraf,
// e-posta/rol/hesap durumu editöre YİNE sızmaz (bkz. staffProfiles kuralları).
function renderStaffDirectory(profiles) {
  const uids = Object.keys(profiles || {});
  if (!uids.length) { setState('Henüz profil fotoğrafı/adı paylaşan kimse yok.'); return; }
  uids.sort((a, b) => String((profiles[a] || {}).displayName || '').localeCompare(String((profiles[b] || {}).displayName || ''), 'tr'));
  grid.innerHTML = `<div style="grid-column:1/-1;color:var(--text-muted);font-size:13px;margin-bottom:4px">${uids.length} kişi</div>` +
    uids.map((uid) => {
      const p = profiles[uid] || {};
      const name = String(p.displayName || '').trim() || '(isim yok)';
      const initial = name.charAt(0).toUpperCase() || '?';
      const hasPhoto = isSafeAvatarUrl(p.avatarUrl);
      // &quot; kullanılmalı, literal " DEĞİL -- bkz. render()'daki AYNI notu.
      const avStyle = hasPhoto
        ? `background-image:url(&quot;${String(p.avatarUrl).replace(/["'()]/g, '')}&quot;)`
        : 'background:linear-gradient(135deg,var(--blue),#0550a0)';
      return `
        <div class="contact-card">
          <div class="av${hasPhoto ? ' has-photo' : ''}" style="${avStyle}">${hasPhoto ? '' : escapeHtml(initial)}</div>
          <div class="name">${escapeHtml(name)}</div>
        </div>
      `;
    }).join('');
}
function loadStaffDirectory() {
  setState('Yükleniyor…');
  database.ref('staffProfiles').once('value').then((snap) => {
    renderStaffDirectory(snap.val() || {});
  }).catch((err) => {
    console.error('Kişi rehberi yüklenemedi:', err);
    setState('Kişi rehberi yüklenemedi.');
  });
}

let authorized = false;
let modeReady = false;
let currentRole = '';
auth.onAuthStateChanged((user) => {
  if (!user) { setState('Bu sayfayı görüntülemek için giriş yapmış olmanız gerekir.'); return; }
  database.ref('users/' + user.uid + '/role').once('value').then((snap) => {
    const role = snap.val();
    currentRole = role;
    if (role === 'admin' || role === 'owner') {
      authorized = true;
      initDbMode(database).then(() => {
        modeReady = true;
        renderDbModeBanner();
        loadUsersAndEvents();
      });
    } else if (role === 'editor') {
      authorized = true;
      loadStaffDirectory();
    } else {
      setState('Kişiler yalnızca onaylı editör/admin/kurucu rolündeki kullanıcılara açıktır.');
    }
  }).catch((err) => {
    console.error('Yetki kontrol edilemedi:', err);
    setState('Yetki kontrol edilemedi.');
  });
});

onDbModeChange(() => {
  if (currentRole === 'editor') { if (authorized) {loadStaffDirectory();} return; }
  if (!modeReady) {return;}
  renderDbModeBanner();
  if (authorized) {loadUsersAndEvents();}
});
</script>

</body>
</html>
