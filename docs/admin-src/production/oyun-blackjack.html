<!DOCTYPE html>
<html lang="tr">

<title>Blackjack | Protokol</title>
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<body data-shell="admin" data-page="games" data-breadcrumb="Anasayfa|index.html > Oyunlar|oyunlar.html > Blackjack">

<main class="main">
<div class="page-wrapper">

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle">Oyunlar</div>
        <h1 class="page-title">Blackjack (21)</h1>
      </div>
      <div class="card-options">
        <span class="bj-bakiye" data-bj-bakiye>… çip</span>

  </div>

        <div class="bj-deste-yigini" data-bj-deste-yigini></div>

      </div>
      <div class="bj-koltuklar" data-bj-koltuklar></div>
      <aside class="bj-bahis-panel" data-bj-bahis-panel aria-live="polite"></aside>
      <div class="bj-aksiyonlar-satiri">
        <div class="bj-aksiyon-sayac" data-bj-aksiyon-sayac></div>
        <div class="bj-aksiyonlar" data-bj-aksiyonlar></div>
      </div>
    </div>
  </div>

</div>
</main>

<script type="module">
import('/src/v4/blackjack-oyun.js').then((m) => m.initBlackjack());
