<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Blackjack | Protokol</title>
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Ana sitedeki (protokol.sbs) omu-protokol Firebase projesiyle aynı config -- bkz. blackjack-oyun.js. -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="games" data-breadcrumb="Anasayfa|index.html > Oyunlar|oyunlar.html > Blackjack">

<!-- Dikey telefonda masa hiç açılmaz; cihaz yönü tarayıcı tarafından kilitlenemediği için yönlendirme kullanılır (Hold'em ile aynı desen). -->
<div class="bj-rotate-overlay" data-bj-rotate-overlay role="alert" aria-live="assertive">
  <div class="bj-rotate-icon" aria-hidden="true">↻</div>
  <strong>Telefonunu yatay çevir</strong>
  <span>Blackjack masasındaki tüm koltukları ve kartları görebilmek için yatay görünüm gerekir.</span>
</div>

<main class="main bj-main">
<div class="page-wrapper">

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle">Oyunlar</div>
        <h1 class="page-title">Blackjack (21)</h1>
      </div>
      <div class="card-options">
        <span class="bj-bakiye" data-bj-bakiye>… çip</span>
        <button type="button" class="btn btn-outline bj-skin-carki-btn" data-bj-skin-carki title="Kart skinleri">⚙</button>
      </div>
    </div>
  </div>

  <div class="bj-islem-durumu">
    <span data-bj-durum role="status" aria-live="polite"></span>
    <button type="button" class="btn btn-outline" data-bj-yeniden-dene hidden>Tekrar dene</button>
  </div>
  <div class="bj-masa-viewport">
    <div class="bj-masa" data-bj-root>
      <div class="bj-krupiyer-satiri">
        <div class="bj-deste-yigini" data-bj-deste-yigini></div>
        <div class="bj-krupiyer-alani">
          <div class="bj-krupiyer" data-bj-krupiyer></div>
          <div class="bj-sayac" data-bj-sayac></div>
        </div>
      </div>
      <div class="bj-koltuklar" data-bj-koltuklar></div>
      <aside class="bj-bahis-panel" data-bj-bahis-panel aria-live="polite"></aside>
      <div class="bj-aksiyonlar-satiri">
        <div class="bj-aksiyon-sayac" data-bj-aksiyon-sayac></div>
        <div class="bj-aksiyonlar" data-bj-aksiyonlar></div>
      </div>
    </div>
  </div>

  <!-- Godot masası -- DENEYSEL, yalnız ?godot=1 ile açılıyor (Pişti'nin ilk
       aşamasıyla AYNI güvenlik deseni: varsayılan ziyaretçiler etkilenmez).
       Mobilde YATAY moddayken tam ekrana geçer. -->
  <style>
    #bj-godot-sarici { position: relative; width: 1600px; height: auto; max-width: 100%; min-width: 0; aspect-ratio: 1600/1100; margin: 0 auto; background: #1a2332; border-radius: 12px; overflow: hidden; box-sizing: border-box; }
    #bj-godot-iframe { width: 100%; height: 100%; min-width: 0; border: 0; display: block; }
    @media (max-width: 900px) and (orientation: landscape) {
      #bj-godot-sarici { position: fixed !important; inset: 0 !important; width: 100vw !important; height: 100vh !important; max-width: none !important; aspect-ratio: unset !important; margin: 0 !important; border-radius: 0 !important; z-index: 9999 !important; }
    }
  </style>
  <div id="bj-godot-sarici" hidden>
    <iframe id="bj-godot-iframe" src="/godot/blackjack/frame.html" title="Blackjack" allow="autoplay"></iframe>
  </div>

</div>
</main>

<script type="module">
import('/src/v4/blackjack-oyun.js').then((m) => m.initBlackjack());
</script>

<script>
(function () {
  if (new URLSearchParams(location.search).get('godot') !== '1') { return; }
  document.querySelector('[data-bj-root]').hidden = true;
  document.querySelector('.bj-islem-durumu').hidden = true;
  document.getElementById('bj-godot-sarici').hidden = false;
}());
</script>

</body>
</html>
