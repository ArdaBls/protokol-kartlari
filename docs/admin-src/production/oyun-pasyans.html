<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Solitaire | Protokol</title>
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="games" data-breadcrumb="Anasayfa|index.html > Oyunlar|oyunlar.html > Solitaire">

<main class="main">
<div class="page-wrapper">

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle">Oyunlar</div>
        <h1 class="page-title">Solitaire</h1>
      </div>
    </div>
  </div>

  <!-- Kullanıcı isteği: "GitHub'da ücretsiz, tam bir oyun -- iframe değil"
       -- Klondike Pasyans, kendi sitemizde çalışıyor (bkz. solitaire-game.js
       dosya başı notu: rjanjic/js-solitaire, MIT, portlandı). Dış kaynağa
       bağlanmıyor, ağ isteği yok. -->
  <div class="pas-scale-wrap" id="js-pas-scale-wrap">
    <div class="pas-window" id="js-pas-window">
      <div class="pas-window__inner">
        <div class="pas-window__heading">
          <div class="pas-window__heading-icon"></div>
          Solitaire
        </div>
        <div class="pas-window__actions">
          <button type="button" id="js-reset" class="pas-new-game">Yeni Oyun</button>
        </div>
        <div class="pas-window__content">
          <div class="pas-window__content-inner">
            <div class="pas-solitaire" id="js-solitaire">
              <div id="js-finish" class="pas-finish-deck"></div>
              <div id="js-board" class="pas-board-deck"></div>

              <div class="pas-deck">
                <div id="js-deck-pile" class="pas-deck__pile"></div>
                <div id="js-deck-deal" class="pas-deck__deal"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
</main>

<script type="module">
import('/src/v4/solitaire-game.js').then((m) => m.initSolitaire());
</script>

</body>
</html>
