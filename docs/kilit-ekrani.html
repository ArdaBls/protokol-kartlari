<body>

<div class="auth-page">
  <div class="auth-card lock-screen">
    <div class="lock-avatar" aria-hidden="true">
      <div class="lock-avatar-circle" id="lock-avatar-circle" style="background:linear-gradient(135deg,var(--primary),var(--primary-dk));background-size:cover;background-position:center">—</div>
      <div class="lock-icon">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5 7V5a3 3 0 016 0v2"/></svg>
      </div>
    </div>

    <div class="auth-title" style="text-align:center;margin-top:14px" id="lock-welcome">Tekrar hoş geldiniz</div>
    <div class="auth-subtitle" style="text-align:center">Oturumunuz güvenlik için kilitlendi. Devam etmek için şifrenizi girin.</div>

    <div id="lock-error" class="form-hint" style="display:none;color:var(--red);margin-bottom:12px"></div>

    <form id="lock-form">
      <div class="form-group">
        <label class="form-label" for="password">Şifre</label>
        <div class="input-group">
          <svg class="input-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5 7V5a3 3 0 016 0v2"/></svg>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required autofocus>
        </div>
      </div>

      <button type="submit" id="lock-submit" class="btn btn-primary" style="width:100%;justify-content:center;height:38px">
        Kilidi Aç
      </button>
    </form>

    <div class="auth-footer">
      <span id="lock-not-user">Bu kullanıcı</span> değil misiniz? <a href="giris.html" id="lock-switch-user">Başka biri olarak giriş yapın</a>
    </div>
  </div>
</div>
