<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Haber detayı | Protokol</title>
<link rel="icon" href="../images/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<!-- Superbuild: kullanıcı isteği "daha detaylı/gelişmiş" bir editör -- classic build'in
     aksine yazı tipi rengi/boyutu, hizalama, tablo, medya gömme, kaynak (HTML) görünümü,
     bul-değiştir gibi tüm eklentileri tek pakette içerir, ayrı ayrı derleme gerektirmez. -->
<script src="https://cdn.ckeditor.com/ckeditor5/41.4.2/super-build/ckeditor.js"></script>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="project-detail" data-breadcrumb="Anasayfa|index.html > Tüm haberler|projects.html > Haber detayı">

<main class="main">
<div class="page-wrapper">

  <div id="detail-root">
    <div class="page-header"><div class="page-header-row"><div><h1 class="page-title">Yükleniyor…</h1></div></div></div>
  </div>

</div>
</main>

<script type="module">
const firebaseConfig = {
  apiKey: 'AIzaSyDOfhq3aYW6sg2_zj0sFsRzXeGziGtLxCk',
  authDomain: 'omu-protokol.firebaseapp.com',
  databaseURL: 'https://omu-protokol-default-rtdb.europe-west1.firebasedatabase.app',
  projectId: 'omu-protokol'
};
if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
const database = firebase.database();

const DURUM_LABEL = { planlandi: 'Planlandı', yaziliyor: 'Haber yazılıyor', incelemede: 'İncelemede', tamamlandi: 'Tamamlandı', iptal: 'İptal' };
const DURUM_CLS   = { yaziliyor: 'status-yellow', incelemede: 'status-blue', tamamlandi: 'status-green', iptal: 'status-red' };
const LEGACY_DURUM = { cekildi: 'planlandi', haber: 'yaziliyor', yayinlandi: 'tamamlandi' };
const normalizeDurum = (d) => { const k = d || 'planlandi'; return LEGACY_DURUM[k] || k; };

const root = document.getElementById('detail-root');
const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const parseNameList = (s) => String(s || '').split(',').map((x) => x.trim()).filter(Boolean);

function fmtTarih(key) {
  if (!key) return '';
  const [y, m, d] = key.split('-');
  return d && m && y ? `${d}.${m}.${y}` : key;
}

function setMessage(title, body) {
  root.innerHTML = `
    <div class="page-header"><div class="page-header-row"><div>
      <div class="page-pretitle">Haberler</div>
      <h1 class="page-title">${escapeHtml(title)}</h1>
    </div></div></div>
    <div class="card"><div class="card-body" style="color:var(--text-muted)">${escapeHtml(body)}</div></div>
  `;
}

let canWrite = false;
let ckEditorInstance = null;

function render(id, e) {
  const durum = normalizeDurum(e.durum);
  const yazanlar = parseNameList(e.haberYazanlari);
  const gorevliler = parseNameList(e.gorevli);
  document.title = (e.ad || 'Haber detayı') + ' | Protokol';

  root.innerHTML = `
    <div class="page-header">
      <div class="page-header-row">
        <div>
          <div class="page-pretitle">Haberler · ${escapeHtml(fmtTarih(e.tarih))}</div>
          <h1 class="page-title">${escapeHtml(e.ad || '(adsız)')}</h1>
        </div>
        <div class="page-actions">
          <span class="status ${DURUM_CLS[durum] || ''}" style="font-size:12.5px">${DURUM_LABEL[durum] || durum}</span>
          ${e.arsiv ? `<a class="btn btn-outline" href="${escapeHtml(e.arsiv)}" target="_blank" rel="noopener">Arşiv bağlantısı</a>` : ''}
        </div>
      </div>
    </div>

    <div class="row col-8-4">
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="card">
          <div class="card-header">
            <div class="card-title">Haber metni</div>
            ${canWrite ? '<button type="button" class="btn btn-primary" id="haberSaveBtn" style="display:none">Kaydet</button>' : ''}
          </div>
          <div class="card-body">
            ${canWrite
              ? `<div id="haberEditor">${e.haberMetni || ''}</div>`
              : `<div style="font-size:13px;color:var(--text-secondary);line-height:1.7">${e.haberMetni || '<span style="color:var(--text-muted)">Bu etkinlik için henüz haber metni girilmemiş.</span>'}</div>`}
          </div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="card">
          <div class="card-header"><div class="card-title">Etkinlik bilgileri</div></div>
          <div class="card-body" style="display:flex;flex-direction:column;gap:10px">
            ${canWrite ? `
              <div class="field"><label for="ed-tarih">Tarih</label><input type="date" id="ed-tarih" class="form-control" value="${escapeHtml(e.tarih || '')}"></div>
              <div class="field"><label for="ed-yer">Yer / Mekân</label><input type="text" id="ed-yer" class="form-control" value="${escapeHtml(e.yer || '')}"></div>
              <div class="field"><label for="ed-birim">Düzenleyen Birim</label><input type="text" id="ed-birim" class="form-control" value="${escapeHtml(e.birim || '')}"></div>
              <div class="field"><label for="ed-planlayan">Planlayan / Sorumlu</label><input type="text" id="ed-planlayan" class="form-control" value="${escapeHtml(e.planlayan || '')}"></div>
            ` : `
              <div style="font-size:13px;color:var(--text-secondary);line-height:2">
                <div><span style="color:var(--text-muted)">Tarih</span> · <strong style="color:var(--text)">${escapeHtml(fmtTarih(e.tarih))}</strong></div>
                ${e.yer ? `<div><span style="color:var(--text-muted)">Yer</span> · ${escapeHtml(e.yer)}</div>` : ''}
                ${e.birim ? `<div><span style="color:var(--text-muted)">Düzenleyen birim</span> · ${escapeHtml(e.birim)}</div>` : ''}
                ${e.planlayan ? `<div><span style="color:var(--text-muted)">Planlayan</span> · ${escapeHtml(e.planlayan)}</div>` : ''}
              </div>
            `}
          </div>
        </div>

        <div class="card">
          <div class="card-header"><div class="card-title">Haberi yazan(lar)</div></div>
          <div class="card-body">
            ${canWrite
              ? `<input type="text" id="ed-haberYazanlari" class="form-control" placeholder="Virgülle ayırarak yazın" value="${escapeHtml(e.haberYazanlari || '')}">`
              : `<div style="font-size:13px;color:var(--text-secondary)">${yazanlar.length ? yazanlar.map((n) => escapeHtml(n)).join('<br>') : '<span style="color:var(--text-muted)">Henüz işlenmemiş.</span>'}</div>`}
          </div>
        </div>

        <div class="card">
          <div class="card-header"><div class="card-title">Basın görevlisi</div></div>
          <div class="card-body">
            ${canWrite
              ? `<input type="text" id="ed-gorevli" class="form-control" placeholder="Virgülle ayırarak yazın" value="${escapeHtml(e.gorevli || '')}">`
              : `<div style="font-size:13px;color:var(--text-secondary)">${gorevliler.length ? gorevliler.map((n) => escapeHtml(n)).join('<br>') : '<span style="color:var(--text-muted)">Atanmamış.</span>'}</div>`}
          </div>
        </div>
      </div>
    </div>
  `;

  if (canWrite) {
    const saveBtn = document.getElementById('haberSaveBtn');
    const fieldIds = ['ed-tarih', 'ed-yer', 'ed-birim', 'ed-planlayan', 'ed-haberYazanlari', 'ed-gorevli'];
    const fieldEls = fieldIds.map((fid) => document.getElementById(fid));

    ClassicEditor.create(document.getElementById('haberEditor'), {
      toolbar: {
        items: [
          'heading', '|', 'fontSize', 'fontColor', 'fontBackgroundColor', '|',
          'bold', 'italic', 'underline', 'strikethrough', 'removeFormat', '|',
          'bulletedList', 'numberedList', 'todoList', 'outdent', 'indent', 'alignment', '|',
          'link', 'blockQuote', 'insertTable', 'mediaEmbed', 'horizontalLine', 'specialCharacters', '|',
          'findAndReplace', 'sourceEditing', '|', 'undo', 'redo'
        ],
        shouldNotGroupWhenFull: true
      },
      table: { contentToolbar: ['tableColumn', 'tableRow', 'mergeTableCells'] }
    }).then((editor) => {
      ckEditorInstance = editor;
      const originalHtml = editor.getData();
      const original = { haberMetni: originalHtml };
      fieldIds.forEach((fid, i) => { original[fid] = fieldEls[i].value; });

      const updateSaveVisibility = () => {
        const changed = editor.getData() !== original.haberMetni || fieldIds.some((fid, i) => fieldEls[i].value !== original[fid]);
        saveBtn.style.display = changed ? '' : 'none';
      };
      editor.model.document.on('change:data', updateSaveVisibility);
      fieldEls.forEach((el) => el.addEventListener('input', updateSaveVisibility));

      saveBtn.addEventListener('click', () => {
        saveBtn.disabled = true; saveBtn.textContent = 'Kaydediliyor…';
        const patch = {
          haberMetni: editor.getData(),
          tarih: fieldEls[0].value || e.tarih || '',
          yer: fieldEls[1].value.trim(),
          birim: fieldEls[2].value.trim(),
          planlayan: fieldEls[3].value.trim(),
          haberYazanlari: fieldEls[4].value.trim(),
          gorevli: fieldEls[5].value.trim(),
          guncellemeTs: Date.now()
        };
        database.ref('etkinlikler/' + id).update(patch).then(() => {
          database.ref('logs/etkinlik').push({
            action: (e.ad || '(adsız)') + ' etkinliğinin haber detayı güncellendi',
            by: currentUserName || (firebase.auth().currentUser && firebase.auth().currentUser.email) || '',
            ts: Date.now()
          });
          Object.assign(e, patch);
          fieldIds.forEach((fid, i) => { original[fid] = fieldEls[i].value; });
          original.haberMetni = editor.getData();
          saveBtn.textContent = 'Kaydedildi ✓';
          setTimeout(() => { saveBtn.style.display = 'none'; saveBtn.disabled = false; saveBtn.textContent = 'Kaydet'; }, 1400);
        }).catch((err) => {
          console.error('Haber detayı kaydedilemedi:', err);
          saveBtn.disabled = false; saveBtn.textContent = 'Kaydet';
          alert('Kaydedilemedi, tekrar deneyin.');
        });
      });
    }).catch((err) => { console.error('CKEditor başlatılamadı:', err); });
  }
}

let currentUserName = '';
const id = new URLSearchParams(location.search).get('id');

function loadEvent() {
  if (!id) { setMessage('Haber detayı', 'Bir etkinlik seçilmedi. Tüm haberler sayfasından bir habere tıklayın.'); return; }
  database.ref('etkinlikler/' + id).once('value').then((snap) => {
    const e = snap.val();
    if (!e) { setMessage('Haber bulunamadı', 'Bu etkinlik silinmiş veya artık mevcut değil.'); return; }
    render(id, e);
  }).catch((err) => {
    console.error('Haber yüklenemedi:', err);
    setMessage('Haber detayı', 'Yüklenemedi.');
  });
}

firebase.auth().onAuthStateChanged((user) => {
  if (!user) { canWrite = false; loadEvent(); return; }
  database.ref('users/' + user.uid).once('value').then((snap) => {
    const u = snap.val() || {};
    canWrite = u.role === 'editor' || u.role === 'admin' || u.role === 'owner';
    currentUserName = ((u.firstName || '') + ' ' + (u.lastName || '')).trim() || user.email || '';
    loadEvent();
  }).catch(() => { canWrite = false; loadEvent(); });
});
</script>

</body>
</html>
