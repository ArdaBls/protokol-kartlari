<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tüm haberler | Protokol</title>
<link rel="icon" href="../images/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- Ana sitedeki (protokol.sbs) omu-protokol Firebase projesiyle aynı config. Etkinliklerin
     haberMetni alanı dolu olanları listeler (bkz. index.html'deki etkinlik formu, "Haber Metni"). -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="projects" data-breadcrumb="Anasayfa|index.html > Tüm haberler">

<main class="main">
<div class="page-wrapper">

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle">Haberler</div>
        <h1 class="page-title">Tüm haberler</h1>
      </div>
      <div class="page-actions">
        <div class="search-box" style="width:220px">
          <svg class="s-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
          <input type="text" id="news-search" placeholder="Haber ara…" aria-label="Haber ara">
        </div>
      </div>
    </div>
  </div>

  <div class="row col-3" id="projects-grid">
    <div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:32px">Yükleniyor…</div>
  </div>

</div>
</main>

<script type="module">
const firebaseConfig = {
  apiKey: 'AIzaSyDOfhq3aYW6sg2_zj0sFsRzXeGziGtLxCk',
  authDomain: 'omu-protokol.firebaseapp.com',
  databaseURL: 'https://omu-protokol-default-rtdb.europe-west1.firebasedatabase.app',
  projectId: 'omu-protokol'
};
if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
const database = firebase.database();

const DURUM_LABEL = { planlandi: 'Planlandı', yaziliyor: 'Haber yazılıyor', incelemede: 'İncelemede', tamamlandi: 'Tamamlandı', iptal: 'İptal' };
const DURUM_CLS   = { yaziliyor: 'status-yellow', incelemede: 'status-blue', tamamlandi: 'status-green', iptal: 'status-red' };
// "Gerçekleşti" aşaması kaldırılıp durum tek iş akışında birleştirildi (bkz. app.js
// EVENT_STATUS) -- eski kayıtlardaki cekildi/haber/yayinlandi değerleri en yakın yeni
// karşılığına eşlenir, ham/çevrilmemiş metin görünmesin diye.
const LEGACY_DURUM = { cekildi: 'planlandi', haber: 'yaziliyor', yayinlandi: 'tamamlandi' };
const normalizeDurum = (d) => { const k = d || 'planlandi'; return LEGACY_DURUM[k] || k; };

const grid = document.getElementById('projects-grid');
const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const parseNameList = (s) => String(s || '').split(',').map((x) => x.trim()).filter(Boolean);

function fmtTarih(key) {
  if (!key) return '';
  const [y, m, d] = key.split('-');
  return d && m && y ? `${d}.${m}.${y}` : key;
}

let NEWS = [];
let filterText = '';
let canWrite = false;
let currentUserName = '';

function setState(html) {
  grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:32px">${html}</div>`;
}

function render() {
  const q = filterText.toLowerCase();
  const items = NEWS.filter(([, e]) => !q || (e.ad || '').toLowerCase().includes(q) || (e.haberMetni || '').toLowerCase().includes(q));
  if (!items.length) { setState('Eşleşen haber yok.'); return; }

  grid.innerHTML = items.map(([id, e]) => {
    const durum = normalizeDurum(e.durum);
    const writers = parseNameList(e.haberYazanlari).join(', ') || '—';
    // haberMetni artık CKEditor'ün ürettiği HTML -- kart önizlemesinde etiketler
    // olmadan düz metin gösterilir.
    const plain = String(e.haberMetni || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
    const excerpt = plain.slice(0, 140);
    return `
      <a class="card" href="project_detail.html?id=${encodeURIComponent(id)}" style="display:block;padding:16px;text-decoration:none;color:inherit;position:relative">
        ${canWrite ? `<button type="button" class="card-opt-btn news-delete-btn" data-id="${escapeHtml(id)}" title="Bu haberi sil" aria-label="Bu haberi sil" style="position:absolute;top:10px;right:10px;z-index:2">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4h10M6.5 4V2.5h3V4M4.5 4l.5 9.5h6l.5-9.5"/></svg>
        </button>` : ''}
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:start;margin-bottom:6px">
          <div style="font-size:14px;font-weight:600;color:var(--text);padding-right:${canWrite ? '26px' : '0'}">${escapeHtml(e.ad || '(adsız)')}</div>
          <span class="status ${DURUM_CLS[durum] || ''}" style="flex-shrink:0">${DURUM_LABEL[durum] || durum}</span>
        </div>
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px">${escapeHtml(fmtTarih(e.tarih))}${e.yer ? ' · ' + escapeHtml(e.yer) : ''}</div>
        <div style="font-size:12.5px;color:var(--text-secondary);line-height:1.5;margin-bottom:10px">${excerpt ? escapeHtml(excerpt) + (plain.length > 140 ? '…' : '') : '<span style="color:var(--text-muted)">Haber metni henüz girilmedi.</span>'}</div>
        <div style="font-size:11.5px;color:var(--text-muted)">Yazan: ${escapeHtml(writers)}</div>
      </a>
    `;
  }).join('');
}

document.getElementById('news-search').addEventListener('input', (e) => { filterText = e.target.value; render(); });

grid.addEventListener('click', (e) => {
  const btn = e.target.closest('.news-delete-btn');
  if (!btn) { return; }
  e.preventDefault(); e.stopPropagation();
  const id = btn.dataset.id;
  const entry = NEWS.find(([nid]) => nid === id);
  const name = entry ? (entry[1].ad || '(adsız)') : '(adsız)';
  if (!window.confirm(`"${name}" etkinliğini/haberini kalıcı olarak silmek istediğinize emin misiniz?`)) { return; }
  database.ref('etkinlikler/' + id).remove().then(() => {
    database.ref('logs/etkinlik').push({ action: name + ' etkinliği silindi', by: currentUserName, ts: Date.now() });
    NEWS = NEWS.filter(([nid]) => nid !== id);
    render();
  }).catch((err) => {
    console.error('Silinemedi:', err);
    alert('Silinemedi, tekrar deneyin.');
  });
});

function loadNews() {
  setState('Yükleniyor…');
  database.ref('etkinlikler').once('value').then((snap) => {
    const events = snap.val() || {};
    // Kullanıcı isteği: haber metni doldurulmuş olsun olmasın HER etkinlik burada listelenir --
    // haberi yazma/düzenleme artık project_detail.html'deki CKEditor sisteminde yapılıyor,
    // buradaki liste "girilecek/düzenlenecek haberler" panosu gibi çalışır. Sıralama, etkinlik
    // tarihine değil EKLENME zamanına (olusturmaTs) göre -- en son eklenen en üstte.
    NEWS = Object.entries(events)
      .filter(([, e]) => e && e.ad)
      .sort((a, b) => (b[1].olusturmaTs || 0) - (a[1].olusturmaTs || 0));
    if (!NEWS.length) { setState('Henüz etkinlik yok.'); return; }
    render();
  }).catch((err) => {
    console.error('Haberler yüklenemedi:', err);
    setState('Haberler yüklenemedi.');
  });
}

firebase.auth().onAuthStateChanged((user) => {
  if (!user) { canWrite = false; loadNews(); return; }
  database.ref('users/' + user.uid).once('value').then((snap) => {
    const u = snap.val() || {};
    canWrite = u.role === 'editor' || u.role === 'admin' || u.role === 'owner';
    currentUserName = ((u.firstName || '') + ' ' + (u.lastName || '')).trim() || user.email || '';
    loadNews();
  }).catch(() => { canWrite = false; loadNews(); });
});
</script>

</body>
</html>
