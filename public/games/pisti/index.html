<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pişti | Protokol</title>
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Ana sitedeki (protokol.sbs) omu-protokol Firebase projesiyle aynı config -- bkz. pisti-oyun.js. -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<link rel="stylesheet" href="./css/main-v4-Cp8P4lJI.css">
<style>
  html, body { width: 100%; height: 100%; min-height: 100%; background: #0f0b15 !important; }
  body { overflow-x: hidden; }
  .sidebar, .topbar, .footer, .page-header { display: none !important; }
  .main {
    height: 100dvh !important;
    min-height: 100dvh !important;
    margin-inline-start: 0 !important;
    padding-top: 0 !important;
    overflow: hidden;
  }
  .main .page-wrapper {
    width: 100%;
    max-width: none;
    height: 100%;
    min-height: 0;
    padding: 8px 12px 12px;
  }
  .pisti-masa-viewport {
    flex: 1 1 auto;
    min-height: 0;
    align-items: stretch;
  }
  .pisti-masa {
    width: 100%;
    max-width: none;
    min-height: 0;
  }

  /* Kartın görünür yüzeyi ile dokunma alanı birebir aynıdır. */
  .pisti-el-kart-btn {
    width: 96px;
    margin-left: -48px;
    touch-action: none;
  }
  .pisti-el-kart-btn .pisti-kart {
    width: 100%;
    margin-left: 0;
    pointer-events: none;
  }
  .pisti-el-kart-btn.pisti-el-kart-suruklenen,
  .pisti-el-kart-btn.pisti-el-kart-suruklenen:hover {
    transform: translateX(calc(var(--pisti-x) + var(--pisti-drag-x, 0px)))
      translateY(calc(var(--pisti-y) + var(--pisti-drag-y, 0px)))
      rotate(var(--pisti-rot));
    transition: none;
    cursor: grabbing;
    z-index: 999 !important;
  }
  /* Dokunmatik tarayıcılar :hover durumunu kalıcı bırakabilir. Kartların
     bir kısmını pasifleştirmek seçimin rastgele görünmesine yol açıyordu. */
  .pisti-elim:has(.pisti-el-kart-suruklenen) .pisti-el-kart-btn:not(.pisti-el-kart-suruklenen),
  .pisti-elim:has(.pisti-el-kart-btn:hover) .pisti-el-kart-btn:not(:hover) {
    pointer-events: auto;
  }
  .pisti-el-kart-btn:not(:disabled):hover,
  .pisti-el-kart-btn:not(:disabled):focus-visible {
    transform: translateX(calc(var(--pisti-x) + var(--pisti-drag-x, 0px)))
      translateY(-54px) rotate(calc(var(--pisti-rot) * .3)) scale(1.06);
    z-index: 999 !important;
    outline: none;
  }
  .pisti-kart-ucusu {
    position: fixed;
    z-index: 9999;
    pointer-events: none;
    will-change: transform, opacity;
    transition: transform .32s cubic-bezier(.22, .61, .36, 1), opacity .32s ease-in;
  }
  .pisti-koltuk-topladigi {
    position: relative;
    display: inline-flex;
    align-items: center;
    min-height: 22px;
    padding-inline: 17px;
  }
  .pisti-koltuk-topladigi::before,
  .pisti-koltuk-topladigi::after {
    content: '';
    position: absolute;
    width: 14px;
    aspect-ratio: 5 / 7;
    border: 1px solid rgba(255, 255, 255, .55);
    border-radius: 2px;
    background: #7b2632 url('/assets/blackjack/deste-arkalari/deste-arkasi-01.png') center / cover;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .35);
  }
  .pisti-koltuk-topladigi::before { left: 0; transform: rotate(-9deg); }
  .pisti-koltuk-topladigi::after { right: 0; transform: rotate(9deg); }
  @media (max-width: 720px) {
    .pisti-el-kart-btn { width: 72px; margin-left: -36px; }
  }

  /* Dört koltuk masanın çevresinde sabit kalır: üstte, altta, sağda ve solda. */
  .pisti-masa-viewport { overflow: visible; }
  .pisti-masa {
    display: block;
    height: 100%;
    min-height: 0;
    padding: 0;
    overflow: hidden;
  }
  .pisti-koltuklar {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 6;
  }
  .pisti-koltuk-slot {
    position: absolute;
    display: block;
    width: clamp(104px, 14vw, 164px);
    min-width: 0;
    pointer-events: auto;
  }
  .pisti-koltuk-slot[data-pisti-koltuk-slot="0"] {
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
  }
  .pisti-koltuk-slot[data-pisti-koltuk-slot="1"] {
    top: 49%;
    left: 3%;
    transform: translateY(-50%);
  }
  .pisti-koltuk-slot[data-pisti-koltuk-slot="2"] {
    bottom: 158px;
    left: 50%;
    transform: translateX(-50%);
  }
  .pisti-koltuk-slot[data-pisti-koltuk-slot="3"] {
    top: 49%;
    right: 3%;
    transform: translateY(-50%);
  }
  .pisti-koltuk,
  .pisti-koltuk-ben {
    position: relative;
    visibility: visible;
    width: 100%;
    min-height: 0;
  }
  .pisti-koltuk-topladigi {
    position: absolute;
    display: block;
    width: 32px;
    height: 46px;
    min-height: 0;
    padding: 0;
    color: transparent;
    font-size: 0;
    line-height: 0;
  }
  .pisti-koltuk-topladigi::before,
  .pisti-koltuk-topladigi::after {
    top: 0;
    width: 27px;
    border-radius: 3px;
    background: #7b2632 url('/assets/blackjack/deste-arkalari/deste-arkasi-01.png') center / cover;
  }
  .pisti-koltuk-topladigi::before { left: 0; transform: rotate(-7deg); }
  .pisti-koltuk-topladigi::after { right: 0; transform: rotate(8deg); }
  /* Her oyuncunun kendi soluna bakan kart yığını. */
  .pisti-koltuk-slot[data-pisti-koltuk-slot="0"] .pisti-koltuk-topladigi {
    top: 50%;
    left: calc(100% + 12px);
    transform: translateY(-50%);
  }
  .pisti-koltuk-slot[data-pisti-koltuk-slot="1"] .pisti-koltuk-topladigi {
    right: 50%;
    bottom: calc(100% + 10px);
  }
  .pisti-koltuk-slot[data-pisti-koltuk-slot="2"] .pisti-koltuk-topladigi {
    top: 50%;
    right: calc(100% + 12px);
    transform: translateY(-50%);
  }
  .pisti-koltuk-slot[data-pisti-koltuk-slot="3"] .pisti-koltuk-topladigi {
    top: calc(100% + 10px);
    left: 50%;
  }
  .pisti-masa-kartlari-alani {
    position: absolute;
    top: 50%;
    left: 50%;
    z-index: 4;
    display: block;
    width: 190px;
    min-height: 210px;
    margin: 0;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .pisti-masa-kartlari {
    position: relative;
    width: 190px;
    height: 210px;
    pointer-events: none;
  }
  .pisti-masa-bos {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    text-align: center;
  }
  .pisti-masa-sabit-kart {
    position: absolute;
    top: 50%;
    left: 50%;
    width: clamp(68px, 7vw, 94px) !important;
    height: auto;
    margin: 0;
    transform: translate(-50%, -50%) translate(var(--pisti-stack-x), var(--pisti-stack-y)) rotate(var(--pisti-stack-rot));
    transform-origin: center;
    transition: none !important;
    animation: none !important;
    box-shadow: 0 3px 9px rgba(0, 0, 0, .34);
  }
  .pisti-masa-kartlari > .pisti-yigin-alt-kart,
  .pisti-masa-kartlari > .pisti-ust-kart {
    animation: none !important;
    transition: none !important;
  }
  .pisti-elim {
    position: absolute;
    /* Kartlar masa kenarının altında kalmasın; dışarı taşan eski -34px
       konumunu da açıkça geçersiz kıl. */
    bottom: clamp(36px, 5vh, 52px);
    left: 50%;
    z-index: 8;
    width: min(86%, 640px);
    height: 148px;
    margin: 0;
    transform: translateX(-50%);
  }
  .pisti-el-kart-btn {
    bottom: 0 !important;
    user-select: none;
    -webkit-user-select: none;
  }
  .pisti-el-kart-btn.pisti-el-kart-suruklenen,
  .pisti-el-kart-btn.pisti-el-kart-suruklenen:hover {
    transform: translate3d(calc(var(--pisti-x) + var(--pisti-drag-x, 0px)), calc(var(--pisti-y) + var(--pisti-drag-y, 0px)), 0) rotate(var(--pisti-rot)) !important;
  }
  @media (max-width: 720px) {
    .main .page-wrapper { padding: 8px; }
    .pisti-masa {
      height: 100%;
      min-height: 640px;
      border-width: 5px;
      border-radius: 26px;
    }
    .pisti-koltuk-slot { width: 78px; }
    .pisti-koltuk-slot[data-pisti-koltuk-slot="0"] { top: 14px; }
    .pisti-koltuk-slot[data-pisti-koltuk-slot="1"] { left: 5px; }
    .pisti-koltuk-slot[data-pisti-koltuk-slot="2"] { bottom: 124px; }
    .pisti-koltuk-slot[data-pisti-koltuk-slot="3"] { right: 5px; }
    .pisti-koltuk strong { max-width: 78px; font-size: 10px; }
    .pisti-koltuk-skor,
    .pisti-sira-isareti { font-size: 9px; }
    .pisti-koltuk-topladigi { width: 25px; height: 36px; }
    .pisti-koltuk-topladigi::before,
    .pisti-koltuk-topladigi::after { width: 21px; }
    .pisti-koltuk-slot[data-pisti-koltuk-slot="0"] .pisti-koltuk-topladigi { left: calc(100% + 4px); }
    .pisti-koltuk-slot[data-pisti-koltuk-slot="2"] .pisti-koltuk-topladigi { right: calc(100% + 4px); }
    .pisti-masa-kartlari-alani { top: 50%; width: 142px; min-height: 164px; }
    .pisti-masa-kartlari { width: 142px; height: 164px; }
    .pisti-masa-sabit-kart { width: 62px !important; }
    .pisti-elim { width: 94%; height: 118px; }
    .pisti-el-kart-btn { bottom: 0; }
  }
</style>
</head>
<body data-page="games">

<main class="main">
<div class="page-wrapper">

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle">Oyunlar</div>
        <h1 class="page-title">Pişti</h1>
      </div>
    </div>
  </div>

  <div class="pisti-islem-durumu">
    <span data-pisti-durum role="status" aria-live="polite"></span>
    <button type="button" class="btn btn-primary" data-pisti-baslat hidden>Oyunu başlat</button>
    <button type="button" class="btn btn-outline" data-pisti-yeniden-dene hidden>Tekrar dene</button>
    <button type="button" class="btn btn-outline" data-pisti-kalk-durum hidden>Kalk</button>
    <button type="button" class="btn btn-outline" data-pisti-teklif-bitir hidden>Oyunu bitir</button>
  </div>
  <div class="pisti-teklif-paneli" data-pisti-teklif-paneli hidden></div>

  <div class="pisti-skor-tablosu" data-pisti-skor-tablosu></div>

  <div class="pisti-masa-viewport">
    <div class="pisti-masa" data-pisti-root>
      <div class="pisti-koltuklar" data-pisti-koltuklar></div>
      <div class="pisti-masa-kartlari-alani">
        <div class="pisti-masa-kartlari" data-pisti-masa-kartlari></div>
      </div>
      <div class="pisti-elim" data-pisti-elim></div>
      <div class="pisti-el-bitti-paneli" data-pisti-el-bitti-paneli hidden></div>
      <div class="pisti-oyun-bitti-paneli" data-pisti-oyun-bitti-paneli hidden></div>
    </div>
  </div>

  <p class="hint" data-pisti-oturmadim hidden style="text-align:center;">Oynamak için boş bir koltuğa (+) tıklayın.</p>
  <div style="text-align:center;">
    <span aria-live="polite" data-pisti-sira-bildirimi></span>
    <strong data-pisti-sayac></strong>
  </div>

</div>
</main>

<script type="module" src="./js/oyun-pisti-pnMqftMH.js"></script>
<script type="module" src="./js/pisti-card-interaction.js"></script>
<script type="module" src="./js/pisti-table-layout.js"></script>

</body>
</html>
